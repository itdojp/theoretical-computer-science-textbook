name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        bundle install
        npm install
        
    - name: Lint Markdown
      run: npm run lint
      continue-on-error: true
      
    - name: Spell check
      run: npm run spellcheck
      
    - name: Check links
      run: npm run check-links
      continue-on-error: true
      
    - name: Build site
      run: npm run build
      env:
        JEKYLL_ENV: production
        PAGES_REPO_NWO: itdojp/theoretical-computer-science-textbook

    - name: Install htmltest
      run: |
        curl -sSfL https://htmltest.wjdp.uk | bash -s -- -b ./bin
        echo "${PWD}/bin" >> "$GITHUB_PATH"

    - name: Prepare baseurl mirror (for local link check)
      shell: bash
      run: |
        set -euo pipefail
        # Resolve baseurl (GitHub Pages project site uses /<repo> by default)
        baseurl="$(python3 - <<'PY'
        import os, re, pathlib
        cfg = pathlib.Path('docs/_config.yml')
        repo = os.environ.get('GITHUB_REPOSITORY','').split('/')[-1]
        val = ''
        if cfg.exists():
            m = re.search(r'(?m)^baseurl:\\s*(.+)\\s*$', cfg.read_text(encoding='utf-8'))
            if m:
                val = m.group(1).strip().strip('"').strip("'")
        if not val:
            val = '/' + repo
        if not val.startswith('/'):
            val = '/' + val
        print(val)
        PY
        )"
        echo "baseurl=${baseurl}"
        # Mirror built output into _site/<baseurl>/ so absolute URLs like /<baseurl>/... resolve locally.
        if [[ -n "${baseurl}" && "${baseurl}" != "/" ]]; then
          dest="_site${baseurl}"
          mkdir -p "${dest}"
          base_dir="${baseurl#/}"
          tar -C _site --exclude "./${base_dir}" -cf - . | tar -C "${dest}" -xf -
        fi

    - name: HTML link/image check (htmltest)
      run: |
        htmltest

    - name: Test built site
      run: |
        ls -la _site/
        test -f _site/index.html
