name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        bundle install
        npm install
        
    - name: Lint Markdown
      run: npm run lint
      continue-on-error: true
      
    - name: Spell check
      run: npm run spellcheck
      
    - name: Check links
      run: npm run check-links
      continue-on-error: true
      
    - name: Build site
      run: npm run build
      env:
        JEKYLL_ENV: production
        PAGES_REPO_NWO: itdojp/theoretical-computer-science-textbook
        
    - name: Test built site
      run: |
        ls -la _site/
        test -f _site/index.html