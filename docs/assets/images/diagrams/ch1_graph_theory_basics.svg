<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <title>グラフ理論の基本概念</title>
  <desc>無向グラフ、単純グラフ、木構造の例</desc>
  
  <defs>
    <style>
      .vertex { fill: #e3f2fd; stroke: #1976d2; stroke-width: 3px; }
      .edge { stroke: #333; stroke-width: 2px; fill: none; }
      .tree-edge { stroke: #4caf50; stroke-width: 2px; fill: none; }
      .multiple-edge { stroke: #f44336; stroke-width: 2px; fill: none; }
      .loop-edge { stroke: #ff9800; stroke-width: 2px; fill: none; }
      
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .subtitle { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 14px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #2c3e50;
      }
      
      .vertex-label { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 14px; 
        font-weight: 600; 
        text-anchor: middle; 
        dominant-baseline: central;
        fill: #333;
      }
      
      .description { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 11px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #666;
      }
      
      .graph-type { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 12px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1976d2;
      }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" class="title">グラフ理論の基本概念</text>
  
  <!-- Simple Graph -->
  <g id="simple-graph">
    <text x="200" y="70" class="subtitle">単純グラフ（Simple Graph）</text>
    
    <!-- Vertices -->
    <circle cx="150" cy="120" r="20" class="vertex" />
    <text x="150" y="120" class="vertex-label">A</text>
    
    <circle cx="250" cy="120" r="20" class="vertex" />
    <text x="250" y="120" class="vertex-label">B</text>
    
    <circle cx="150" cy="200" r="20" class="vertex" />
    <text x="150" y="200" class="vertex-label">D</text>
    
    <circle cx="250" cy="200" r="20" class="vertex" />
    <text x="250" y="200" class="vertex-label">C</text>
    
    <!-- Edges -->
    <line x1="170" y1="120" x2="230" y2="120" class="edge" />
    <line x1="250" y1="140" x2="250" y2="180" class="edge" />
    <line x1="230" y1="200" x2="170" y2="200" class="edge" />
    <line x1="150" y1="180" x2="150" y2="140" class="edge" />
    <line x1="170" y1="140" x2="230" y2="180" class="edge" />
    
    <!-- Properties -->
    <text x="200" y="250" class="graph-type">特徴</text>
    <text x="120" y="270" class="description">• ループなし（自分自身への辺なし）</text>
    <text x="120" y="285" class="description">• 多重辺なし（2点間の辺は最大1本）</text>
    <text x="120" y="300" class="description">• 最も基本的なグラフ</text>
  </g>
  
  <!-- Tree Graph -->
  <g id="tree-graph">
    <text x="600" y="70" class="subtitle">木（Tree）</text>
    
    <!-- Root -->
    <circle cx="600" cy="120" r="20" class="vertex" />
    <text x="600" y="120" class="vertex-label">A</text>
    
    <!-- Level 1 -->
    <circle cx="550" cy="180" r="20" class="vertex" />
    <text x="550" y="180" class="vertex-label">B</text>
    
    <circle cx="650" cy="180" r="20" class="vertex" />
    <text x="650" y="180" class="vertex-label">C</text>
    
    <!-- Level 2 -->
    <circle cx="520" cy="240" r="20" class="vertex" />
    <text x="520" y="240" class="vertex-label">D</text>
    
    <circle cx="580" cy="240" r="20" class="vertex" />
    <text x="580" y="240" class="vertex-label">E</text>
    
    <circle cx="680" cy="240" r="20" class="vertex" />
    <text x="680" y="240" class="vertex-label">F</text>
    
    <!-- Tree edges -->
    <line x1="600" y1="140" x2="550" y2="160" class="tree-edge" />
    <line x1="600" y1="140" x2="650" y2="160" class="tree-edge" />
    <line x1="550" y1="200" x2="520" y2="220" class="tree-edge" />
    <line x1="550" y1="200" x2="580" y2="220" class="tree-edge" />
    <line x1="650" y1="200" x2="680" y2="220" class="tree-edge" />
    
    <!-- Properties -->
    <text x="600" y="290" class="graph-type">特徴</text>
    <text x="520" y="310" class="description">• 連結グラフ（全頂点が繋がっている）</text>
    <text x="520" y="325" class="description">• 非環式（閉路がない）</text>
    <text x="520" y="340" class="description">• n個の頂点に対してn-1本の辺</text>
  </g>
  
  <!-- Multigraph -->
  <g id="multigraph">
    <text x="1000" y="70" class="subtitle">多重グラフ（Multigraph）</text>
    
    <!-- Vertices -->
    <circle cx="950" cy="130" r="20" class="vertex" />
    <text x="950" y="130" class="vertex-label">A</text>
    
    <circle cx="1050" cy="130" r="20" class="vertex" />
    <text x="1050" y="130" class="vertex-label">B</text>
    
    <circle cx="1000" cy="210" r="20" class="vertex" />
    <text x="1000" y="210" class="vertex-label">C</text>
    
    <!-- Multiple edges between A and B -->
    <path d="M 970 120 Q 1000 100 1030 120" class="multiple-edge" />
    <line x1="970" y1="130" x2="1030" y2="130" class="multiple-edge" />
    <path d="M 970 140 Q 1000 160 1030 140" class="multiple-edge" />
    
    <!-- Loop at C -->
    <path d="M 1020 210 Q 1040 190 1040 210 Q 1040 230 1020 210" class="loop-edge" />
    
    <!-- Regular edges -->
    <line x1="950" y1="150" x2="980" y2="190" class="edge" />
    <line x1="1020" y1="190" x2="1050" y2="150" class="edge" />
    
    <!-- Properties -->
    <text x="1000" y="270" class="graph-type">特徴</text>
    <text x="920" y="290" class="description">• 多重辺あり（2点間に複数の辺）</text>
    <text x="920" y="305" class="description">• ループあり（自分自身への辺）</text>
    <text x="920" y="320" class="description">• より一般的なグラフ構造</text>
  </g>
  
  <!-- Graph Theory Definitions -->
  <rect x="100" y="370" width="1000" height="400" style="fill: #f8f9fa; stroke: #6c757d; stroke-width: 2px; rx: 4px;" />
  <text x="600" y="400" class="title">グラフ理論の基本定義</text>
  
  <!-- Basic definitions -->
  <g id="definitions">
    <text x="120" y="430" class="subtitle">基本用語</text>
    
    <text x="140" y="450" class="description">• グラフ G = (V, E)：頂点集合Vと辺集合Eの組</text>
    <text x="140" y="470" class="description">• 頂点（vertex/node）：グラフの構成要素となる点</text>
    <text x="140" y="490" class="description">• 辺（edge）：2つの頂点を結ぶ線</text>
    <text x="140" y="510" class="description">• 次数（degree）：ある頂点に接続する辺の数</text>
    <text x="140" y="530" class="description">• パス（path）：頂点を辺で結んだ道筋</text>
    <text x="140" y="550" class="description">• サイクル（cycle）：始点と終点が同じ閉じたパス</text>
  </g>
  
  <!-- Graph properties -->
  <g id="properties">
    <text x="600" y="430" class="subtitle">グラフの性質</text>
    
    <text x="620" y="450" class="description">• 連結性（connectivity）：全ての頂点対がパスで結ばれる</text>
    <text x="620" y="470" class="description">• 平面性（planarity）：辺の交差なしに平面に描ける</text>
    <text x="620" y="490" class="description">• 二部性（bipartiteness）：頂点を2つの集合に分割可能</text>
    <text x="620" y="510" class="description">• オイラー性：全ての辺を1度ずつ通るパスの存在</text>
    <text x="620" y="530" class="description">• ハミルトン性：全ての頂点を1度ずつ通るパスの存在</text>
  </g>
  
  <!-- Applications -->
  <g id="applications">
    <text x="120" y="590" class="subtitle">応用分野</text>
    
    <text x="140" y="610" class="description">• ネットワーク理論：インターネット、SNS、交通網</text>
    <text x="140" y="630" class="description">• アルゴリズム：最短経路、最小全域木、ネットワークフロー</text>
    <text x="140" y="650" class="description">• 化学：分子構造の表現と解析</text>
    <text x="140" y="670" class="description">• 生物学：生態系、遺伝子ネットワーク</text>
    <text x="140" y="690" class="description">• コンピュータ科学：データ構造、並列計算、回路設計</text>
  </g>
  
  <!-- Important theorems -->
  <g id="theorems">
    <text x="600" y="590" class="subtitle">重要な定理</text>
    
    <text x="620" y="610" class="description">• 握手定理：全頂点の次数の和 = 2 × 辺数</text>
    <text x="620" y="630" class="description">• オイラーの公式：連結平面グラフで V - E + F = 2</text>
    <text x="620" y="650" class="description">• ケーニヒの定理：二部グラフの最大マッチング</text>
    <text x="620" y="670" class="description">• 四色定理：平面グラフは4色で彩色可能</text>
    <text x="620" y="690" class="description">• ラムゼー理論：大きなグラフに必ず現れる構造</text>
  </g>
  
  <!-- Complexity note -->
  <text x="120" y="730" class="subtitle">計算複雑性</text>
  <text x="140" y="750" class="description">多くのグラフ問題（ハミルトン路、グラフ彩色、最大クリーク等）はNP完全問題に属し、効率的なアルゴリズムは未発見</text>
</svg>