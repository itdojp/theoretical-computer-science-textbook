<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <title>命題論理の決定手続きの比較</title>
  <desc>真理値表法とDPLLアルゴリズムの比較</desc>
  
  <defs>
    <style>
      .truth-table { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2px; }
      .dpll-algorithm { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2px; }
      .complexity-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 2px; }
      
      .procedure-box { 
        rx: 4px; 
        ry: 4px; 
        font-family: Inter, Helvetica, sans-serif;
      }
      
      .title { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .subtitle { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 14px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #2c3e50;
      }
      
      .step-label { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 12px; 
        font-weight: 500; 
        text-anchor: middle; 
        dominant-baseline: central;
        fill: #333;
      }
      
      .description { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 11px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #666;
      }
      
      .complexity-text { 
        font-family: Courier, monospace;
        font-size: 12px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #333;
      }
      
      .arrow {
        stroke: #2c3e50;
        stroke-width: 2px;
        fill: none;
        marker-end: url(#arrowhead);
      }
      
      .branch-arrow {
        stroke: #666;
        stroke-width: 1px;
        fill: none;
        marker-end: url(#branch-arrowhead);
      }
    </style>
    
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
    
    <marker id="branch-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" class="title">命題論理の決定手続きの比較</text>
  
  <!-- Truth Table Method -->
  <g id="truth-table-method">
    <text x="300" y="70" class="subtitle">真理値表法（Truth Table Method）</text>
    
    <!-- Step 1 -->
    <rect x="100" y="100" width="180" height="60" class="procedure-box truth-table" />
    <text x="190" y="120" class="step-label">ステップ1</text>
    <text x="190" y="135" class="step-label">すべての真理値割当を列挙</text>
    <text x="190" y="150" class="description">2ⁿ 通りの変数割当</text>
    
    <!-- Step 2 -->
    <rect x="100" y="180" width="180" height="60" class="procedure-box truth-table" />
    <text x="190" y="200" class="step-label">ステップ2</text>
    <text x="190" y="215" class="step-label">各割当で論理式を評価</text>
    <text x="190" y="230" class="description">構文木を辿って計算</text>
    
    <!-- Step 3 -->
    <rect x="100" y="260" width="180" height="60" class="procedure-box truth-table" />
    <text x="190" y="280" class="step-label">ステップ3</text>
    <text x="190" y="295" class="step-label">充足可能性を判定</text>
    <text x="190" y="310" class="description">一つでも真なら SAT</text>
    
    <!-- Complexity -->
    <rect x="100" y="340" width="180" height="80" class="procedure-box complexity-box" />
    <text x="190" y="365" class="subtitle">計算量</text>
    <text x="190" y="385" class="complexity-text">O(2ⁿ · |φ|)</text>
    <text x="110" y="405" class="description">n: 変数数, |φ|: 論理式サイズ</text>
    
    <!-- Arrows -->
    <path d="M 190 160 L 190 180" class="arrow" />
    <path d="M 190 240 L 190 260" class="arrow" />
    <path d="M 190 320 L 190 340" class="arrow" />
  </g>
  
  <!-- DPLL Algorithm -->
  <g id="dpll-algorithm">
    <text x="700" y="70" class="subtitle">DPLLアルゴリズム（効率化手法）</text>
    
    <!-- Preprocessing -->
    <rect x="500" y="100" width="200" height="80" class="procedure-box dpll-algorithm" />
    <text x="600" y="125" class="step-label">前処理</text>
    <text x="510" y="145" class="description">• 単位伝播（Unit Propagation）</text>
    <text x="510" y="160" class="description">• 純リテラル削除（Pure Literal）</text>
    <text x="510" y="175" class="description">• 自明な節の削除</text>
    
    <!-- Variable Selection -->
    <rect x="500" y="200" width="200" height="60" class="procedure-box dpll-algorithm" />
    <text x="600" y="220" class="step-label">分岐変数の選択</text>
    <text x="600" y="235" class="step-label">ヒューリスティック適用</text>
    <text x="600" y="250" class="description">VSIDS, JW等</text>
    
    <!-- Branching -->
    <rect x="450" y="280" width="120" height="60" class="procedure-box dpll-algorithm" />
    <text x="510" y="305" class="step-label">True分岐</text>
    <text x="510" y="320" class="description">変数をTrueに</text>
    
    <rect x="630" y="280" width="120" height="60" class="procedure-box dpll-algorithm" />
    <text x="690" y="305" class="step-label">False分岐</text>
    <text x="690" y="320" class="description">変数をFalseに</text>
    
    <!-- Recursive Solving -->
    <rect x="500" y="360" width="200" height="60" class="procedure-box dpll-algorithm" />
    <text x="600" y="380" class="step-label">再帰的に解決</text>
    <text x="600" y="395" class="step-label">バックトラック</text>
    <text x="600" y="410" class="description">制約違反時に戻る</text>
    
    <!-- Learning (CDCL extension) -->
    <rect x="750" y="360" width="180" height="60" class="procedure-box complexity-box" />
    <text x="840" y="380" class="step-label">学習節の追加</text>
    <text x="840" y="395" class="description">CDCL拡張</text>
    <text x="840" y="410" class="description">競合分析と学習</text>
    
    <!-- Arrows -->
    <path d="M 600 180 L 600 200" class="arrow" />
    <path d="M 570 260 L 510 280" class="branch-arrow" />
    <path d="M 630 260 L 690 280" class="branch-arrow" />
    <path d="M 510 340 L 550 360" class="arrow" />
    <path d="M 690 340 L 650 360" class="arrow" />
    <path d="M 700 390 L 750 390" class="arrow" />
  </g>
  
  <!-- Comparison Table -->
  <rect x="100" y="460" width="1000" height="300" style="fill: #f8f9fa; stroke: #6c757d; stroke-width: 2px; rx: 4px;" />
  <text x="600" y="490" class="title">手法の比較</text>
  
  <!-- Table headers -->
  <rect x="150" y="510" width="200" height="30" fill="#e9ecef" stroke="#6c757d" stroke-width="1px" />
  <rect x="350" y="510" width="200" height="30" fill="#e9ecef" stroke="#6c757d" stroke-width="1px" />
  <rect x="550" y="510" width="200" height="30" fill="#e9ecef" stroke="#6c757d" stroke-width="1px" />
  <rect x="750" y="510" width="200" height="30" fill="#e9ecef" stroke="#6c757d" stroke-width="1px" />
  
  <text x="250" y="530" class="step-label">手法</text>
  <text x="450" y="530" class="step-label">時間計算量</text>
  <text x="650" y="530" class="step-label">空間計算量</text>
  <text x="850" y="530" class="step-label">実用性</text>
  
  <!-- Truth Table row -->
  <rect x="150" y="540" width="200" height="40" fill="#e3f2fd" stroke="#6c757d" stroke-width="1px" />
  <rect x="350" y="540" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  <rect x="550" y="540" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  <rect x="750" y="540" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  
  <text x="250" y="565" class="step-label">真理値表法</text>
  <text x="450" y="565" class="complexity-text">O(2ⁿ · |φ|)</text>
  <text x="650" y="565" class="complexity-text">O(n)</text>
  <text x="850" y="560" class="description">小さな問題のみ</text>
  
  <!-- DPLL row -->
  <rect x="150" y="580" width="200" height="40" fill="#e8f5e9" stroke="#6c757d" stroke-width="1px" />
  <rect x="350" y="580" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  <rect x="550" y="580" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  <rect x="750" y="580" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  
  <text x="250" y="605" class="step-label">DPLL</text>
  <text x="450" y="605" class="complexity-text">O(2ⁿ) 最悪</text>
  <text x="650" y="605" class="complexity-text">O(n)</text>
  <text x="850" y="600" class="description">多くの実問題で効率的</text>
  
  <!-- Modern SAT row -->
  <rect x="150" y="620" width="200" height="40" fill="#fff3e0" stroke="#6c757d" stroke-width="1px" />
  <rect x="350" y="620" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  <rect x="550" y="620" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  <rect x="750" y="620" width="200" height="40" fill="white" stroke="#6c757d" stroke-width="1px" />
  
  <text x="250" y="645" class="step-label">現代SATソルバ</text>
  <text x="450" y="645" class="complexity-text">CDCL+学習</text>
  <text x="650" y="645" class="complexity-text">O(n + 学習節)</text>
  <text x="850" y="640" class="description">産業応用可能</text>
  
  <!-- Key improvements -->
  <text x="130" y="690" class="subtitle" style="text-anchor:start">DPLLの改良点</text>
  <text x="140" y="710" class="description">• 枝刈り：早期に矛盾を検出して無駄な探索を回避</text>
  <text x="140" y="725" class="description">• ヒューリスティック：効果的な変数選択で探索効率を向上</text>
  <text x="140" y="740" class="description">• 学習：競合節を学習して同じ失敗を繰り返さない（CDCL）</text>
</svg>
