<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg">
  <title>チューリング機械の構成要素</title>
  <desc>チューリング機械の形式的定義と各構成要素の説明図</desc>
  
  <defs>
    <style>
      .component-box { 
        fill: #e3f2fd; 
        stroke: #1976d2; 
        stroke-width: 2px; 
        rx: 4px; 
        ry: 4px; 
      }
      
      .formal-def-box {
        fill: #fff3e0;
        stroke: #f57c00;
        stroke-width: 2px;
        rx: 4px;
        ry: 4px;
      }
      
      .title { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .subtitle { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 14px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #2c3e50;
      }
      
      .component-title { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 13px; 
        font-weight: 600; 
        text-anchor: start; 
        fill: #1976d2;
      }
      
      .component-desc { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 11px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #333;
      }
      
      .formal-notation {
        font-family: Courier, monospace;
        font-size: 15px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #f57c00;
      }
      
      .tape-cell {
        fill: white;
        stroke: #333;
        stroke-width: 1px;
      }
      
      .tape-text {
        font-family: Courier, monospace;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
        fill: #333;
      }
      
      .head-pointer {
        fill: #e74c3c;
      }
    </style>
  </defs>
  
  <!-- Main Title -->
  <text x="450" y="30" class="title">チューリング機械の構成要素</text>
  
  <!-- Formal Definition Box -->
  <rect x="275" y="50" width="350" height="60" class="formal-def-box" />
  <text x="450" y="75" class="formal-notation">M = (Q, Σ, Γ, δ, q₀, qaccept, qreject)</text>
  <text x="450" y="95" class="subtitle">形式的定義</text>
  
  <!-- Component Grid Layout -->
  
  <!-- Row 1: Q, Σ, Γ -->
  <rect x="50" y="140" width="240" height="70" class="component-box" />
  <text x="60" y="160" class="component-title">Q: 状態の有限集合</text>
  <!-- Left-align and wrap to avoid right overflow inside the box -->
  <text x="60" y="175" class="component-desc" text-anchor="start">{q₀, q₁, q₂, ... ,</text>
  <text x="60" y="190" class="component-desc" text-anchor="start"> qaccept, qreject}</text>

  <rect x="330" y="140" width="240" height="70" class="component-box" />
  <text x="340" y="160" class="component-title">Σ: 入力アルファベット</text>
  <text x="340" y="175" class="component-desc">{0, 1} または {a, b, c}</text>
  <text x="340" y="190" class="component-desc">・入力に使用する記号　・空白記号は含まない</text>

  <rect x="610" y="140" width="240" height="70" class="component-box" />
  <text x="620" y="160" class="component-title">Γ: テープアルファベット</text>
  <text x="620" y="175" class="component-desc">Σ ∪ {␣} ∪ {補助記号}</text>
  <text x="620" y="190" class="component-desc">・テープ上の全記号　・空白記号を含む</text>
  
  <!-- Row 2: δ, q₀, Accept/Reject -->
  <rect x="50" y="240" width="280" height="95" class="component-box" />
  <text x="60" y="260" class="component-title">δ: 遷移関数</text>
  <text x="60" y="275" class="component-desc">Q × Γ → Q × Γ × {L, R}</text>
  <text x="60" y="290" class="component-desc">現在状態と読み取り記号から</text>
  <text x="60" y="305" class="component-desc">次状態・書込み記号・移動方向</text>
  <text x="60" y="320" class="component-desc">を決定</text>

  <rect x="370" y="240" width="200" height="95" class="component-box" />
  <text x="380" y="260" class="component-title">q₀: 初期状態</text>
  <text x="380" y="275" class="component-desc">計算開始時の状態</text>
  <text x="380" y="290" class="component-desc">・Q の一つの元</text>
  <text x="380" y="305" class="component-desc">・計算の開始点</text>

  <rect x="610" y="240" width="240" height="95" class="component-box" />
  <text x="620" y="260" class="component-title">qaccept, qreject</text>
  <text x="620" y="275" class="component-desc">受理状態・拒否状態</text>
  <text x="620" y="290" class="component-desc">・計算の終了状態</text>
  <text x="620" y="305" class="component-desc">・入力の受理/拒否を決定</text>

  <!-- Computation Example Section -->
  <rect x="80" y="365" width="740" height="170" style="fill: #f8f9fa; stroke: #6c757d; stroke-width: 2px; rx: 4px;" />
  <text x="450" y="390" class="subtitle">計算の例：文字列 "101" の処理</text>
  
  <!-- Tape visualization -->
  <g transform="translate(200, 410)">
    <!-- Tape label -->
    <text x="-100" y="20" class="component-title">テープ:</text>
    
    <!-- Tape cells -->
    <rect x="0" y="0" width="50" height="40" class="tape-cell" />
    <rect x="50" y="0" width="50" height="40" class="tape-cell" />
    <rect x="100" y="0" width="50" height="40" class="tape-cell" />
    <rect x="150" y="0" width="50" height="40" class="tape-cell" />
    <rect x="200" y="0" width="50" height="40" class="tape-cell" />
    
    <!-- Tape content -->
    <text x="25" y="25" class="tape-text">1</text>
    <text x="75" y="25" class="tape-text">0</text>
    <text x="125" y="25" class="tape-text">1</text>
    <text x="175" y="25" class="tape-text">␣</text>
    <text x="225" y="25" class="tape-text">...</text>
    
    <!-- Read/Write head (with box) -->
    <rect x="15" y="45" width="20" height="20" style="fill: #ffcccb; stroke: #e74c3c; stroke-width: 2px; rx: 2px;" />
    <polygon points="20,50 30,50 25,60" class="head-pointer" />
    <text x="25" y="85" class="component-desc" text-anchor="middle">読み書きヘッド</text>
  </g>

  <!-- Control unit (moved down) -->
  <g transform="translate(450, 480)">
    <rect x="0" y="0" width="150" height="60" style="fill: #d4edda; stroke: #28a745; stroke-width: 2px; rx: 4px;" />
    <text x="75" y="25" class="component-title" text-anchor="middle">制御部</text>
    <text x="75" y="40" class="component-desc" text-anchor="middle">現在状態: q₁</text>
    <text x="75" y="55" class="component-desc" text-anchor="middle">読み取り記号: 1</text>
  </g>
  
  <!-- Connection line from head to control unit -->
  <line x1="225" y1="470" x2="450" y2="510" stroke="#666" stroke-width="2" stroke-dasharray="5,5" />
  <text x="337" y="485" class="component-desc" text-anchor="middle" style="font-size: 10px;">制御信号</text>
  
  <!-- Transition explanation -->
  <text x="100" y="565" class="component-desc">遷移例: δ(q₁, 1) = (q₂, 0, R)</text>
  <text x="100" y="580" class="component-desc">「状態q₁で記号1を読むと、0を書いてq₂に遷移し右に移動」</text>

  <!-- 7±2 rule compliant legend -->
  <g transform="translate(50, 595)">
    <rect x="0" y="0" width="800" height="80" style="fill: #f0f8ff; stroke: #4682b4; stroke-width: 1px; rx: 4px;" />
    <text x="400" y="20" class="subtitle">チューリング機械の動作</text>
    <text x="20" y="40" class="component-desc">1. 現在状態と読み取り記号を確認</text>
    <text x="280" y="40" class="component-desc">2. 遷移関数δに従って動作決定</text>
    <text x="20" y="55" class="component-desc">3. 新しい記号を書き込み</text>
    <text x="280" y="55" class="component-desc">4. 状態を更新しヘッドを移動</text>
    <text x="20" y="70" class="component-desc">5. 受理・拒否状態に到達するまで繰り返し</text>
  </g>
</svg>
