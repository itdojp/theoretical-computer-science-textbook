<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <title>情報理論の応用分野</title>
  <desc>データ圧縮、通信理論、機械学習、暗号理論における情報理論の応用</desc>
  
  <defs>
    <style>
      .compression-app { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2px; rx: 8px; }
      .communication-app { fill: #e8f5e8; stroke: #4caf50; stroke-width: 2px; rx: 8px; }
      .ml-app { fill: #fff3e0; stroke: #ff9800; stroke-width: 2px; rx: 8px; }
      .crypto-app { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2px; rx: 8px; }
      .other-app { fill: #ffe0b2; stroke: #f57c00; stroke-width: 2px; rx: 8px; }
      
      .connection-line {
        stroke: #666;
        stroke-width: 2px;
        stroke-dasharray: 3,2;
        fill: none;
      }
      
      .title { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .section-title { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 14px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #333;
      }
      
      .app-title { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 12px; 
        font-weight: 600; 
        text-anchor: start; 
        fill: #333;
      }
      
      .technique { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 10px; 
        font-weight: 500; 
        text-anchor: start; 
        fill: #444;
      }
      
      .description { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 9px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #555;
      }
      
      .example { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 8px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #666;
        font-style: italic;
      }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" class="title">情報理論の応用分野</text>
  
  <!-- Data Compression -->
  <g id="data-compression">
    <text x="350" y="70" class="section-title">データ圧縮</text>
    
    <!-- Lossless Compression -->
    <rect x="50" y="90" width="300" height="170" class="compression-app" />
    <text x="70" y="110" class="app-title">損失なし圧縮</text>
    <text x="70" y="130" class="technique">• Huffman符号</text>
    <text x="80" y="145" class="description">頻度に基づく最適符号化</text>
    <text x="80" y="155" class="example">実用例: 初期のファイル圧縮</text>
    
    <text x="70" y="175" class="technique">• LZ系アルゴリズム</text>
    <text x="80" y="190" class="description">辞書ベース圧縮、繰り返しパターン検出</text>
    <text x="80" y="200" class="example">実用例: ZIP, gzip, LZW</text>
    
    <text x="70" y="220" class="technique">• 算術符号</text>
    <text x="80" y="235" class="description">連続的な確率分布による高効率符号化</text>
    
    <!-- Lossy Compression -->
    <rect x="380" y="90" width="300" height="170" class="compression-app" />
    <text x="400" y="110" class="app-title">損失あり圧縮</text>
    <text x="400" y="130" class="technique">• レート歪み理論</text>
    <text x="410" y="145" class="description">圧縮率と歪みのトレードオフ</text>
    <text x="410" y="155" class="example">R(D) = min I(X;Y) s.t. E[d(X,Y)] ≤ D</text>
    
    <text x="400" y="175" class="technique">• 変換符号化</text>
    <text x="410" y="190" class="description">DCT, ウェーブレット変換</text>
    <text x="410" y="200" class="example">実用例: JPEG (DCT), JPEG2000 (ウェーブレット)</text>
    
    <text x="400" y="220" class="technique">• 心理音響/視覚モデル</text>
    <text x="410" y="235" class="description">人間の知覚特性を利用</text>
    <text x="410" y="245" class="example">実用例: MP3, AAC, H.264</text>
  </g>
  
  <!-- Communication Theory -->
  <g id="communication-theory">
    <text x="1000" y="70" class="section-title">通信理論</text>
    
    <!-- Error Correction -->
    <rect x="750" y="90" width="300" height="170" class="communication-app" />
    <text x="770" y="110" class="app-title">誤り訂正符号</text>
    <text x="770" y="130" class="technique">• ハミング符号</text>
    <text x="780" y="145" class="description">単一ビット誤り検出・訂正</text>
    <text x="780" y="155" class="example">パリティ検査による線形符号</text>
    
    <text x="770" y="175" class="technique">• Reed-Solomon符号</text>
    <text x="780" y="190" class="description">バースト誤り耐性、BCH符号の特殊例</text>
    <text x="780" y="200" class="example">実用例: CD, DVD, QRコード</text>
    
    <text x="770" y="220" class="technique">• 最新の符号</text>
    <text x="780" y="235" class="description">ターボ符号、LDPC符号</text>
    <text x="780" y="245" class="example">Shannon限界に近い性能</text>
    
    <!-- Network Information Theory -->
    <rect x="1080" y="90" width="300" height="170" class="communication-app" />
    <text x="1100" y="110" class="app-title">ネットワーク情報理論</text>
    <text x="1100" y="130" class="technique">• 多元接続通信路</text>
    <text x="1110" y="145" class="description">複数送信者→単一受信者</text>
    <text x="1110" y="155" class="example">携帯電話の上り回線</text>
    
    <text x="1100" y="175" class="technique">• 放送通信路</text>
    <text x="1110" y="190" class="description">単一送信者→複数受信者</text>
    <text x="1110" y="200" class="example">デジタル放送、WiFi</text>
    
    <text x="1100" y="220" class="technique">• 中継通信路</text>
    <text x="1110" y="235" class="description">協調通信、MIMO</text>
    <text x="1110" y="245" class="example">セルラーネットワーク</text>
  </g>
  
  <!-- Machine Learning -->
  <g id="machine-learning">
    <text x="350" y="290" class="section-title">機械学習・AI</text>
    
    <!-- Information-based Learning -->
    <rect x="50" y="310" width="300" height="170" class="ml-app" />
    <text x="70" y="330" class="app-title">情報に基づく学習</text>
    <text x="70" y="350" class="technique">• 決定木学習</text>
    <text x="80" y="365" class="description">情報利得による特徴選択</text>
    <text x="80" y="375" class="example">ID3, C4.5, CART アルゴリズム</text>
    
    <text x="70" y="395" class="technique">• 特徴選択</text>
    <text x="80" y="410" class="description">相互情報量による重要度評価</text>
    <text x="80" y="420" class="example">I(X;Y) の最大化</text>
    
    <text x="70" y="440" class="technique">• クラスタリング</text>
    <text x="80" y="455" class="description">情報ボトルネック原理</text>
    
    <!-- Deep Learning -->
    <rect x="380" y="310" width="300" height="170" class="ml-app" />
    <text x="400" y="330" class="app-title">深層学習</text>
    <text x="400" y="350" class="technique">• 情報ボトルネック理論</text>
    <text x="410" y="365" class="description">DNN の学習過程の理論的説明</text>
    <text x="410" y="375" class="example">表現学習と汎化能力</text>
    
    <text x="400" y="395" class="technique">• 変分推論</text>
    <text x="410" y="410" class="description">KLダイバージェンス最小化</text>
    <text x="410" y="420" class="example">VAE, 変分ベイズ</text>
    
    <text x="400" y="440" class="technique">• 敵対的学習</text>
    <text x="410" y="455" class="description">生成器と識別器の情報ゲーム</text>
    <text x="410" y="465" class="example">GAN, 相互情報量最大化</text>
  </g>
  
  <!-- Cryptography -->
  <g id="cryptography">
    <text x="1000" y="290" class="section-title">暗号理論・セキュリティ</text>
    
    <!-- Information-theoretic Security -->
    <rect x="750" y="310" width="300" height="170" class="crypto-app" />
    <text x="770" y="330" class="app-title">情報理論的安全性</text>
    <text x="770" y="350" class="technique">• 完全秘匿性</text>
    <text x="780" y="365" class="description">I(M;C) = 0 (平文と暗号文が独立)</text>
    <text x="780" y="375" class="example">ワンタイムパッド</text>
    
    <text x="770" y="395" class="technique">• 鍵の長さ</text>
    <text x="780" y="410" class="description">H(K) ≥ H(M) (Shannon の定理)</text>
    <text x="780" y="420" class="example">完全秘匿には十分長い鍵が必要</text>
    
    <text x="770" y="440" class="technique">• 秘密分散</text>
    <text x="780" y="455" class="description">Shamir の閾値秘密分散法</text>
    
    <!-- Privacy and Security -->
    <rect x="1080" y="310" width="300" height="170" class="crypto-app" />
    <text x="1100" y="330" class="app-title">プライバシー保護</text>
    <text x="1100" y="350" class="technique">• 差分プライバシー</text>
    <text x="1110" y="365" class="description">個人情報の統計的保護</text>
    <text x="1110" y="375" class="example">ε-差分プライバシー</text>
    
    <text x="1100" y="395" class="technique">• 情報漏洩の定量化</text>
    <text x="1110" y="410" class="description">相互情報量による漏洩評価</text>
    <text x="1110" y="420" class="example">サイドチャネル攻撃の評価</text>
    
    <text x="1100" y="440" class="technique">• 匿名化</text>
    <text x="1110" y="455" class="description">k-匿名性、l-多様性</text>
  </g>
  
  <!-- Other Applications -->
  <g id="other-applications">
    <text x="700" y="510" class="section-title">その他の応用分野</text>
    
    <!-- Bioinformatics -->
    <rect x="50" y="530" width="250" height="120" class="other-app" />
    <text x="70" y="550" class="app-title">バイオインフォマティクス</text>
    <text x="70" y="570" class="technique">• DNA配列解析</text>
    <text x="80" y="585" class="description">塩基配列の情報量測定</text>
    <text x="70" y="605" class="technique">• 系統樹構築</text>
    <text x="80" y="620" class="description">相互情報量による類似度</text>
    <text x="70" y="640" class="technique">• 遺伝子発現解析</text>
    
    <!-- Economics and Finance -->
    <rect x="320" y="530" width="250" height="120" class="other-app" />
    <text x="340" y="550" class="app-title">経済学・金融</text>
    <text x="340" y="570" class="technique">• 市場効率性</text>
    <text x="350" y="585" class="description">価格情報の伝播速度</text>
    <text x="340" y="605" class="technique">• リスク管理</text>
    <text x="350" y="620" class="description">ポートフォリオの多様性</text>
    <text x="340" y="640" class="technique">• 行動経済学</text>
    
    <!-- Physics -->
    <rect x="590" y="530" width="250" height="120" class="other-app" />
    <text x="610" y="550" class="app-title">物理学</text>
    <text x="610" y="570" class="technique">• 統計物理学</text>
    <text x="620" y="585" class="description">エントロピーと熱力学</text>
    <text x="610" y="605" class="technique">• 量子情報</text>
    <text x="620" y="620" class="description">量子エンタングルメント</text>
    <text x="610" y="640" class="technique">• ブラックホール</text>
    
    <!-- Neuroscience -->
    <rect x="860" y="530" width="250" height="120" class="other-app" />
    <text x="880" y="550" class="app-title">神経科学</text>
    <text x="880" y="570" class="technique">• 神経符号化</text>
    <text x="890" y="585" class="description">スパイク列の情報量</text>
    <text x="880" y="605" class="technique">• 脳の情報処理</text>
    <text x="890" y="620" class="description">相互情報量による機能解析</text>
    <text x="880" y="640" class="technique">• 意識と情報統合</text>
    
    <!-- Social Networks -->
    <rect x="1130" y="530" width="250" height="120" class="other-app" />
    <text x="1150" y="550" class="app-title">ソーシャルネットワーク</text>
    <text x="1150" y="570" class="technique">• 情報拡散</text>
    <text x="1160" y="585" class="description">ネットワーク上の情報伝播</text>
    <text x="1150" y="605" class="technique">• 影響力測定</text>
    <text x="1160" y="620" class="description">ノードの重要度評価</text>
    <text x="1150" y="640" class="technique">• コミュニティ検出</text>
  </g>
  
  <!-- Modern Trends -->
  <g id="modern-trends">
    <rect x="50" y="680" width="1300" height="180" style="fill: #f8f9fa; stroke: #6c757d; stroke-width: 2px; rx: 8px;" />
    <text x="700" y="705" class="section-title">現代的発展と今後の展望</text>
    
    <!-- Left column -->
    <text x="70" y="730" class="app-title">量子情報理論:</text>
    <text x="80" y="745" class="description">• 量子エントロピー、量子相互情報量</text>
    <text x="80" y="760" class="description">• 量子通信路容量、量子誤り訂正</text>
    <text x="80" y="775" class="description">• 量子計算と情報処理</text>
    <text x="80" y="790" class="description">• 量子暗号、量子鍵配送</text>
    
    <!-- Middle-left column -->
    <text x="400" y="730" class="app-title">AI・機械学習の発展:</text>
    <text x="410" y="745" class="description">• 大規模言語モデルの情報理論的解析</text>
    <text x="410" y="760" class="description">• トランスフォーマーの注意機構</text>
    <text x="410" y="775" class="description">• 連続学習と忘却のメカニズム</text>
    <text x="410" y="790" class="description">• 説明可能AIと情報ボトルネック</text>
    
    <!-- Middle-right column -->
    <text x="730" y="730" class="app-title">計算生物学・医学:</text>
    <text x="740" y="745" class="description">• 単一細胞解析と情報量</text>
    <text x="740" y="760" class="description">• 疾患の早期発見アルゴリズム</text>
    <text x="740" y="775" class="description">• 薬物設計と分子情報学</text>
    <text x="740" y="790" class="description">• パーソナライズド医療</text>
    
    <!-- Right column -->
    <text x="1060" y="730" class="app-title">社会・環境問題:</text>
    <text x="1070" y="745" class="description">• 気候変動データの解析</text>
    <text x="1070" y="760" class="description">• スマートシティの最適化</text>
    <text x="1070" y="775" class="description">• エネルギー効率と情報処理</text>
    <text x="1070" y="790" class="description">• 持続可能な情報システム</text>
    
    <!-- Bottom row -->
    <text x="70" y="820" class="app-title">新しい理論的発展:</text>
    <text x="80" y="835" class="description">• 非可換情報理論、作用素代数的アプローチ</text>
    <text x="80" y="850" class="description">• 機械学習理論との深い統合（統計学習理論、PAC学習）</text>
    
    <text x="700" y="820" class="app-title">実用技術への影響:</text>
    <text x="710" y="835" class="description">• 6G通信システム、超低遅延通信</text>
    <text x="710" y="850" class="description">• エッジコンピューティング、分散情報処理</text>
  </g>
  
  <!-- Connection lines between sections -->
  <g id="connections">
    <line x1="350" y1="250" x2="175" y2="310" class="connection-line" />
    <line x1="1000" y1="250" x2="900" y2="310" class="connection-line" />
    <line x1="700" y1="470" x2="700" y2="530" class="connection-line" />
  </g>
</svg>
