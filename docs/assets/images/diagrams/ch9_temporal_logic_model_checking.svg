<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <title>時相論理とモデル検査</title>
  <desc>線形時相論理(LTL)と計算木論理(CTL)、モデル検査手法の比較</desc>
  
  <defs>
    <style>
      .ltl-logic { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2px; rx: 8px; }
      .ctl-logic { fill: #e8f5e8; stroke: #4caf50; stroke-width: 2px; rx: 8px; }
      .model-checking { fill: #fff3e0; stroke: #ff9800; stroke-width: 2px; rx: 8px; }
      .complexity-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2px; rx: 8px; }
      .application-box { fill: #ffe0b2; stroke: #f57c00; stroke-width: 2px; rx: 8px; }
      
      .relation-arrow { 
        stroke: #4caf50; 
        stroke-width: 3px; 
        fill: none; 
        marker-end: url(#relation-arrowhead);
      }
      
      .process-arrow { 
        stroke: #666; 
        stroke-width: 2px; 
        fill: none; 
        marker-end: url(#process-arrowhead);
      }
      
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .section-title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 14px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #333;
      }
      
      .logic-title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 12px; 
        font-weight: 600; 
        text-anchor: start; 
        fill: #333;
      }
      
      .operator-text { 
        font-family: "Monaco", "Menlo", "Ubuntu Mono", "Consolas", "source-code-pro", monospace;
        font-size: 11px; 
        font-weight: 500; 
        text-anchor: start; 
        fill: #333;
      }
      
      .description { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 10px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #555;
      }
      
      .example-text { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 9px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #666;
      }
    </style>
    
    <!-- Arrow markers -->
    <marker id="relation-arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4caf50" />
    </marker>
    <marker id="process-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" class="title">時相論理とモデル検査</text>
  
  <!-- Linear Temporal Logic (LTL) -->
  <g id="ltl-logic">
    <text x="350" y="70" class="section-title">線形時相論理 (LTL)</text>
    
    <rect x="50" y="90" width="300" height="120" class="ltl-logic" />
    <text x="60" y="110" class="logic-title">基本オペレータ</text>
    <text x="70" y="130" class="operator-text">○φ (next): 次の状態でφが成立</text>
    <text x="70" y="145" class="operator-text">□φ (always): すべての未来状態でφが成立</text>
    <text x="70" y="160" class="operator-text">◇φ (eventually): いずれかの未来状態でφが成立</text>
    <text x="70" y="175" class="operator-text">φ U ψ (until): ψが成立するまでφが成立</text>
    <text x="70" y="190" class="operator-text">φ R ψ (release): ψが成立し続ける、またはφが成立</text>
    
    <rect x="50" y="230" width="300" height="80" class="ltl-logic" />
    <text x="60" y="250" class="logic-title">特徴</text>
    <text x="70" y="270" class="description">• 単一実行経路上の性質を記述</text>
    <text x="70" y="285" class="description">• 線形時間構造で解釈</text>
    <text x="70" y="300" class="description">• システムの全実行パスで検証</text>
    
    <rect x="50" y="330" width="300" height="100" class="ltl-logic" />
    <text x="60" y="350" class="logic-title">具体例</text>
    <text x="70" y="370" class="example-text">□(request → ◇grant)</text>
    <text x="80" y="385" class="example-text">"要求があれば必ず許可される"</text>
    <text x="70" y="405" class="example-text">□◇φ</text>
    <text x="80" y="420" class="example-text">"φが無限に頻繁に成立する"</text>
  </g>
  
  <!-- Computation Tree Logic (CTL) -->
  <g id="ctl-logic">
    <text x="750" y="70" class="section-title">計算木論理 (CTL)</text>
    
    <rect x="550" y="90" width="300" height="120" class="ctl-logic" />
    <text x="560" y="110" class="logic-title">基本オペレータ</text>
    <text x="570" y="130" class="operator-text">AXφ, EXφ (next): 全/存在パスの次状態でφ</text>
    <text x="570" y="145" class="operator-text">AGφ, EGφ (always): 全/存在パスでφが常に成立</text>
    <text x="570" y="160" class="operator-text">AFφ, EFφ (eventually): 全/存在パスでφがいずれ成立</text>
    <text x="570" y="175" class="operator-text">AUψ, EUψ (until): 全/存在パスでuntil関係</text>
    <text x="570" y="190" class="operator-text">ARψ, ERψ (release): 全/存在パスでrelease関係</text>
    
    <rect x="550" y="230" width="300" height="80" class="ctl-logic" />
    <text x="560" y="250" class="logic-title">特徴</text>
    <text x="570" y="270" class="description">• 分岐時間構造での性質を記述</text>
    <text x="570" y="285" class="description">• 全経路(A)と存在経路(E)の量化</text>
    <text x="570" y="300" class="description">• 状態ベースの性質記述</text>
    
    <rect x="550" y="330" width="300" height="100" class="ctl-logic" />
    <text x="560" y="350" class="logic-title">具体例</text>
    <text x="570" y="370" class="example-text">AG(request → AFgrant)</text>
    <text x="580" y="385" class="example-text">"要求があれば全パスで必ず許可"</text>
    <text x="570" y="405" class="example-text">EF(φ ∧ EGψ)</text>
    <text x="580" y="420" class="example-text">"φ状態からψが永続する経路が存在"</text>
  </g>
  
  <!-- Comparison -->
  <g id="comparison">
    <rect x="900" y="90" width="450" height="340" class="complexity-box" />
    <text x="1125" y="115" class="section-title">LTL vs CTL の比較</text>
    
    <text x="920" y="140" class="logic-title">表現力:</text>
    <text x="930" y="155" class="description">• LTLとCTLは表現力が異なる（包含関係なし）</text>
    <text x="930" y="170" class="description">• LTL: □◇φ (infinitely often)</text>
    <text x="930" y="185" class="description">• CTL: EF AG φ (reachable stable state)</text>
    
    <text x="920" y="210" class="logic-title">モデル検査の複雑度:</text>
    <text x="930" y="225" class="description">• LTL: O(|M| × 2^|φ|) - 指数時間</text>
    <text x="930" y="240" class="description">• CTL: O(|M| × |φ|) - 線形時間</text>
    <text x="930" y="255" class="description">• |M|: モデルサイズ、|φ|: 式の長さ</text>
    
    <text x="920" y="280" class="logic-title">実用性:</text>
    <text x="930" y="295" class="description">• LTL: プログラム性質、プロトコル検証</text>
    <text x="930" y="310" class="description">• CTL: ハードウェア設計、状態機械</text>
    <text x="930" y="325" class="description">• CTL*: 両方の利点を統合（複雑度高）</text>
    
    <text x="920" y="350" class="logic-title">ツール:</text>
    <text x="930" y="365" class="description">• SPIN (LTL), NuSMV (CTL/LTL)</text>
    <text x="930" y="380" class="description">• TLA+ (LTL), UPPAAL (CTL)</text>
    <text x="930" y="395" class="description">• Java Pathfinder, CBMC</text>
  </g>
  
  <!-- Model Checking Process -->
  <g id="model-checking-process">
    <text x="700" y="480" class="section-title">モデル検査の手順</text>
    
    <rect x="100" y="500" width="200" height="80" class="model-checking" />
    <text x="110" y="520" class="logic-title">1. システムモデル化</text>
    <text x="120" y="535" class="description">• 状態遷移システム構築</text>
    <text x="120" y="550" class="description">• Kripke構造、オートマトン</text>
    <text x="120" y="565" class="description">• 並行システムの同期</text>
    
    <rect x="350" y="500" width="200" height="80" class="model-checking" />
    <text x="360" y="520" class="logic-title">2. 性質の形式化</text>
    <text x="370" y="535" class="description">• LTL/CTL式での記述</text>
    <text x="370" y="550" class="description">• 安全性・活性の表現</text>
    <text x="370" y="565" class="description">• 公平性制約の考慮</text>
    
    <rect x="600" y="500" width="200" height="80" class="model-checking" />
    <text x="610" y="520" class="logic-title">3. 自動検証</text>
    <text x="620" y="535" class="description">• アルゴリズムによる判定</text>
    <text x="620" y="550" class="description">• 反例生成（満たさない場合）</text>
    <text x="620" y="565" class="description">• 状態空間の探索</text>
    
    <rect x="850" y="500" width="200" height="80" class="model-checking" />
    <text x="860" y="520" class="logic-title">4. 結果の解釈</text>
    <text x="870" y="535" class="description">• 検証成功: 性質が成立</text>
    <text x="870" y="550" class="description">• 反例分析: バグの特定</text>
    <text x="870" y="565" class="description">• モデル改良の指針</text>
    
    <!-- Process arrows -->
    <path d="M 300 540 L 340 540" class="process-arrow" />
    <path d="M 550 540 L 590 540" class="process-arrow" />
    <path d="M 800 540 L 840 540" class="process-arrow" />
  </g>
  
  <!-- Applications -->
  <g id="applications">
    <rect x="50" y="620" width="600" height="200" class="application-box" />
    <text x="350" y="645" class="section-title">応用分野</text>
    
    <text x="70" y="670" class="logic-title">ハードウェア検証:</text>
    <text x="80" y="685" class="example-text">• プロセッサの命令パイプライン検証</text>
    <text x="80" y="700" class="example-text">• キャッシュコヒーレンシプロトコル</text>
    <text x="80" y="715" class="example-text">• バス調停メカニズム</text>
    
    <text x="70" y="740" class="logic-title">ソフトウェア検証:</text>
    <text x="80" y="755" class="example-text">• 並行プログラムのデッドロック検出</text>
    <text x="80" y="770" class="example-text">• リアルタイムシステムの時間制約</text>
    <text x="80" y="785" class="example-text">• セキュリティプロパティの検証</text>
    
    <text x="350" y="670" class="logic-title">プロトコル検証:</text>
    <text x="360" y="685" class="example-text">• 通信プロトコルの正当性</text>
    <text x="360" y="700" class="example-text">• 分散アルゴリズムの安全性</text>
    <text x="360" y="715" class="example-text">• 暗号プロトコルの機密性</text>
    
    <text x="350" y="740" class="logic-title">システム設計:</text>
    <text x="360" y="755" class="example-text">• 組み込みシステムの要求仕様</text>
    <text x="360" y="770" class="example-text">• 制御システムの安全性</text>
    <text x="360" y="785" class="example-text">• ヒューマンマシンインタフェース</text>
  </g>
  
  <!-- Challenges and Solutions -->
  <g id="challenges">
    <rect x="700" y="620" width="650" height="200" class="application-box" />
    <text x="1025" y="645" class="section-title">課題と解決法</text>
    
    <text x="720" y="670" class="logic-title">状態爆発問題:</text>
    <text x="730" y="685" class="example-text">• 状態数の指数的増加</text>
    <text x="730" y="700" class="example-text">• 抽象化によるモデル縮約</text>
    <text x="730" y="715" class="example-text">• 対称性削減、部分順序削減</text>
    
    <text x="720" y="740" class="logic-title">スケーラビリティ:</text>
    <text x="730" y="755" class="example-text">• 大規模システムへの適用</text>
    <text x="730" y="770" class="example-text">• 合成的検証(compositional verification)</text>
    <text x="730" y="785" class="example-text">• assume-guarantee推論</text>
    
    <text x="1050" y="670" class="logic-title">実用化技術:</text>
    <text x="1060" y="685" class="example-text">• BDD(Binary Decision Diagram)</text>
    <text x="1060" y="700" class="example-text">• SAT/SMTソルバとの統合</text>
    <text x="1060" y="715" class="example-text">• 反例ガイド抽象化精密化</text>
    
    <text x="1050" y="740" class="logic-title">産業応用:</text>
    <text x="1060" y="755" class="example-text">• 航空宇宙システム(DO-178C)</text>
    <text x="1060" y="770" class="example-text">• 自動車制御(ISO 26262)</text>
    <text x="1060" y="785" class="example-text">• 医療機器(IEC 62304)</text>
  </g>
</svg>