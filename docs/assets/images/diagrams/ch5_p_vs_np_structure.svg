<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">P vs NP 問題の構造</title>
  <desc id="desc">P、NP、coNPクラスの関係と含意、未解決問題の整理</desc>
  
  <defs>
    <style>
      .p-class { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2px; rx: 8px; }
      .np-class { fill: #fff3e0; stroke: #ff9800; stroke-width: 2px; rx: 8px; }
      .conp-class { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2px; rx: 8px; }
      .known-fact { fill: #e8f5e8; stroke: #4caf50; stroke-width: 2px; rx: 8px; }
      .believed-fact { fill: #fff8e1; stroke: #ffc107; stroke-width: 2px; rx: 8px; }
      .unknown-fact { fill: #ffebee; stroke: #f44336; stroke-width: 2px; rx: 8px; }
      .implication-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2px; rx: 8px; }
      
      .inclusion-arrow { 
        stroke: #4caf50; 
        stroke-width: 2.5px; 
        fill: none; 
        marker-end: url(#inclusion-arrowhead);
      }
      
      .unknown-relation { 
        stroke: #f44336; 
        stroke-width: 2px; 
        stroke-dasharray: 5,3;
        fill: none;
      }
      
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .section-title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 14px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #333;
      }
      
      .class-title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 13px; 
        font-weight: 600; 
        text-anchor: start; 
        fill: #333;
      }
      
      .description { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 10px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #555;
      }
      
      .example { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 9px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #666;
        font-style: italic;
      }
      
      .mathematical-statement { 
        font-family: "Monaco", "Menlo", "Ubuntu Mono", "Consolas", "source-code-pro", monospace;
        font-size: 11px; 
        font-weight: 500; 
        text-anchor: start; 
        fill: #333;
      }
      
      .implication-text { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 10px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #d32f2f;
      }
    </style>
    
    <!-- Arrow markers -->
    <marker id="inclusion-arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4caf50" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" class="title">P vs NP 問題の構造</text>
  
  <!-- Basic Complexity Classes -->
  <g id="basic-classes">
    <text x="350" y="70" class="section-title">基本的な複雑性クラス</text>
    
    <!-- P Class -->
    <rect x="50" y="90" width="200" height="120" class="p-class" />
    <text x="60" y="110" class="class-title">P（多項式時間）</text>
    <text x="60" y="130" class="description">• 決定性多項式時間</text>
    <text x="60" y="145" class="description">• 効率的に解ける問題</text>
    <text x="60" y="160" class="description">• 実用的な計算が可能</text>
    <text x="60" y="180" class="example">例: ソート、最短路、線形計画法</text>
    <text x="60" y="195" class="example">最大フロー、素数判定（AKS）</text>
    
    <!-- NP Class -->
    <rect x="270" y="90" width="200" height="120" class="np-class" />
    <text x="280" y="110" class="class-title">NP（非決定性多項式時間）</text>
    <text x="280" y="130" class="description">• 証明書が多項式時間で検証可能</text>
    <text x="280" y="145" class="description">• 解の発見は困難かもしれない</text>
    <text x="280" y="160" class="description">• 「推測して検証」が可能</text>
    <text x="280" y="180" class="example">例: SAT、TSP、因数分解</text>
    <text x="280" y="195" class="example">ナップサック問題、グラフ彩色</text>
    
    <!-- coNP Class -->
    <rect x="490" y="90" width="200" height="120" class="conp-class" />
    <text x="500" y="110" class="class-title">coNP</text>
    <text x="500" y="130" class="description">• NPの補集合クラス</text>
    <text x="500" y="145" class="description">• 反例が多項式時間で検証可能</text>
    <text x="500" y="160" class="description">• 「全ての解がNoであることを証明」</text>
    <text x="500" y="180" class="example">例: UNSAT、素数判定</text>
    <text x="500" y="195" class="example">グラフ非同型、証明検証</text>
  </g>
  
  <!-- Current Knowledge -->
  <g id="current-knowledge">
    <text x="950" y="70" class="section-title">現在の知見</text>
    
    <!-- Known Facts -->
    <rect x="750" y="90" width="180" height="80" class="known-fact" />
    <text x="760" y="110" class="class-title">確実に知られていること</text>
    <text x="760" y="130" class="mathematical-statement">• P ⊆ NP （定義より）</text>
    <text x="760" y="145" class="mathematical-statement">• P ⊊ EXPTIME （階層定理）</text>
    <text x="760" y="160" class="mathematical-statement">• NP ⊆ PSPACE</text>
    
    <!-- Believed Facts -->
    <rect x="950" y="90" width="180" height="80" class="believed-fact" />
    <text x="960" y="110" class="class-title">広く信じられていること</text>
    <text x="960" y="130" class="mathematical-statement">• P ≠ NP</text>
    <text x="960" y="145" class="mathematical-statement">• NP ≠ coNP</text>
    <text x="960" y="160" class="mathematical-statement">• NP ≠ PSPACE</text>
    
    <!-- Unknown Facts -->
    <rect x="1150" y="90" width="180" height="80" class="unknown-fact" />
    <text x="1160" y="110" class="class-title">未解決</text>
    <text x="1160" y="130" class="mathematical-statement">• P vs NP</text>
    <text x="1160" y="145" class="mathematical-statement">• NP vs coNP</text>
    <text x="1160" y="160" class="mathematical-statement">• NP vs PSPACE</text>
  </g>
  
  <!-- Class Relationships Visualization -->
  <g id="class-relationships">
    <text x="350" y="260" class="section-title">クラス間の関係</text>
    
    <!-- Venn diagram style representation -->
    <!-- P circle -->
    <circle cx="200" cy="350" r="80" style="fill: #f3e5f5; fill-opacity: 0.3; stroke: #9c27b0; stroke-width: 3px;" />
    <text x="200" y="320" class="class-title" text-anchor="middle">P</text>
    
    <!-- NP circle -->
    <circle cx="320" cy="350" r="120" style="fill: #fff3e0; fill-opacity: 0.3; stroke: #ff9800; stroke-width: 3px;" />
    <text x="400" y="300" class="class-title" text-anchor="middle">NP</text>
    
    <!-- coNP circle -->
    <circle cx="280" cy="380" r="120" style="fill: #e3f2fd; fill-opacity: 0.3; stroke: #2196f3; stroke-width: 3px;" />
    <text x="200" y="450" class="class-title" text-anchor="middle">coNP</text>
    
    <!-- P ∩ NP ∩ coNP region -->
    <text x="200" y="355" class="description" text-anchor="middle">P ⊆ NP ∩ coNP</text>
    
    <!-- Unknown regions -->
    <text x="380" y="330" class="description" text-anchor="middle">NP \ P?</text>
    <text x="220" y="400" class="description" text-anchor="middle">coNP \ P?</text>
    <text x="320" y="420" class="description" text-anchor="middle">NP ∩ coNP \ P?</text>
  </g>
  
  <!-- P = NP Implications -->
  <g id="p-equals-np-implications">
    <rect x="500" y="250" width="550" height="200" class="implication-box" />
    <text x="775" y="275" class="section-title">P = NP の含意</text>
    
    <text x="520" y="300" class="class-title">もし P = NP なら...</text>
    
    <!-- Cryptography -->
    <text x="530" y="320" class="implication-text">• 現代暗号が無意味になる</text>
    <text x="540" y="335" class="description">RSA、楕円曲線暗号などが破られる</text>
    
    <!-- Optimization -->
    <text x="530" y="355" class="implication-text">• 最適化問題が効率的に解ける</text>
    <text x="540" y="370" class="description">巡回セールスマン、ナップサック問題など</text>
    
    <!-- Mathematics -->
    <text x="530" y="390" class="implication-text">• 数学的証明が自動化される</text>
    <text x="540" y="405" class="description">定理証明、証明検索が多項式時間</text>
    
    <!-- Creativity -->
    <text x="530" y="425" class="implication-text">• 創造的活動が機械化される</text>
    <text x="540" y="440" class="description">音楽作曲、芸術創作の最適解が求まる</text>
    
    <!-- Right column -->
    <text x="800" y="320" class="implication-text">• 機械学習が革命的に進歩</text>
    <text x="810" y="335" class="description">最適な学習モデルが効率的に発見</text>
    
    <text x="800" y="355" class="implication-text">• 経済的影響が甚大</text>
    <text x="810" y="370" class="description">市場予測、資源配分が最適化</text>
    
    <text x="800" y="390" class="implication-text">• 社会構造の根本的変化</text>
    <text x="810" y="405" class="description">プライバシー、セキュリティの概念崩壊</text>
    
    <text x="800" y="425" class="implication-text">• 知的労働の価値変化</text>
    <text x="810" y="440" class="description">人間の認知的優位性の消失</text>
  </g>
  
  <!-- Evidence and Arguments -->
  <g id="evidence-arguments">
    <rect x="50" y="480" width="600" height="180" class="implication-box" />
    <text x="350" y="505" class="section-title">P ≠ NP の根拠と反論</text>
    
    <!-- Arguments for P ≠ NP -->
    <text x="70" y="530" class="class-title">P ≠ NP を支持する根拠：</text>
    
    <text x="80" y="550" class="description">• 自然な証明の障壁（Razborov-Rudich）</text>
    <text x="90" y="565" class="example">多くの下界証明手法が本質的に限界を持つ</text>
    
    <text x="80" y="585" class="description">• 相対化の障壁（Baker-Gill-Solovay）</text>
    <text x="90" y="600" class="example">オラクルを用いた分離結果が両方向に存在</text>
    
    <text x="80" y="620" class="description">• 代数化の障壁（Aaronson-Wigderson）</text>
    <text x="90" y="635" class="example">代数的手法にも根本的限界が存在</text>
    
    <!-- Arguments against -->
    <text x="350" y="530" class="class-title">P = NP の可能性：</text>
    
    <text x="360" y="550" class="description">• アルゴリズム的進歩の歴史</text>
    <text x="370" y="565" class="example">線形計画法、素数判定など</text>
    
    <text x="360" y="585" class="description">• 構成的証明の可能性</text>
    <text x="370" y="600" class="example">非構成的存在証明vs実際のアルゴリズム</text>
    
    <text x="360" y="620" class="description">• 量子計算との関係</text>
    <text x="370" y="635" class="example">BQP vs NP の未解決性</text>
  </g>
  
  <!-- Research Directions -->
  <g id="research-directions">
    <rect x="700" y="480" width="650" height="180" class="implication-box" />
    <text x="1025" y="505" class="section-title">研究の方向性</text>
    
    <!-- Current approaches -->
    <text x="720" y="530" class="class-title">現在の主要アプローチ：</text>
    
    <text x="730" y="550" class="description">• 回路複雑性理論</text>
    <text x="740" y="565" class="example">ブール回路、算術回路による下界証明</text>
    
    <text x="730" y="585" class="description">• 証明複雑性</text>
    <text x="740" y="600" class="example">命題証明システムの分離</text>
    
    <text x="730" y="620" class="description">• 擬似ランダム性</text>
    <text x="740" y="635" class="example">脱ランダム化と計算複雑性の関係</text>
    
    <!-- Emerging areas -->
    <text x="1000" y="530" class="class-title">新興分野：</text>
    
    <text x="1010" y="550" class="description">• 細粒度複雑性理論</text>
    <text x="1020" y="565" class="example">SETH、3SUM、APSP予想</text>
    
    <text x="1010" y="585" class="description">• 量子複雑性理論</text>
    <text x="1020" y="600" class="example">BQP、QMA、量子証明システム</text>
    
    <text x="1010" y="620" class="description">• 機械学習理論</text>
    <text x="1020" y="635" class="example">PAC学習、統計的クエリモデル</text>
  </g>
  
  <!-- Historical Context -->
  <g id="historical-context">
    <rect x="50" y="690" width="1300" height="100" style="fill: #f0f0f0; stroke: #999; stroke-width: 1px; rx: 8px;" />
    <text x="700" y="715" class="section-title">歴史的文脈</text>
    
    <text x="70" y="735" class="description">1971: Cook-Levinの定理でSATのNP完全性が証明される</text>
    <text x="70" y="750" class="description">1972: Karpが21のNP完全問題を発見</text>
    <text x="70" y="765" class="description">1979: Garey &amp; Johnsonの「Computers and Intractability」出版</text>
    <text x="70" y="780" class="description">2000年: Clay数学研究所がP vs NPをミレニアム問題に指定（賞金100万ドル）</text>
    
    <text x="700" y="735" class="description">1990年代: 近似困難性理論の発展（PCP定理）</text>
    <text x="700" y="750" class="description">2002年: AKS素数判定アルゴリズム（P内での素数判定）</text>
    <text x="700" y="765" class="description">2010年代: 細粒度複雑性理論の台頭</text>
    <text x="700" y="780" class="description">現在: 量子計算、機械学習との交差点での新展開</text>
  </g>
</svg>
