<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">PDAの受理方式：最終状態受理 vs 空スタック受理</title>
  <desc id="desc">左に最終状態受理（受理状態への到達）、右に空スタック受理（スタックが空になる）の模式図。</desc>
  <defs>
    <style>
      .label { fill: #111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 12px; }
      .panel { fill: #f8f9fa; stroke: #dee2e6; }
      .state { fill: #fff; stroke: #495057; stroke-width: 1.6; }
      .accept { fill: #e6fcf5; stroke: #12b886; }
      .arrow { stroke: #212529; stroke-width: 1.6; marker-end: url(#m); fill: none; }
      .stack { fill: #fff; stroke: #495057; stroke-width: 1.2; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#212529" />
    </marker>
  </defs>
  <g transform="translate(20,20)">
    <rect class="panel" x="0" y="0" width="340" height="200" rx="8"/>
    <text class="label" x="10" y="16">最終状態受理</text>
    <circle class="state" cx="80" cy="100" r="14"/>
    <text class="label" x="80" y="104" text-anchor="middle">q</text>
    <path class="arrow" d="M 94 100 L 140 100"/>
    <circle class="state accept" cx="160" cy="100" r="14"/>
    <text class="label" x="160" y="104" text-anchor="middle">q_acc</text>
  </g>
  <g transform="translate(400,20)">
    <rect class="panel" x="0" y="0" width="340" height="200" rx="8"/>
    <text class="label" x="10" y="16">空スタック受理</text>
    <circle class="state" cx="80" cy="100" r="14"/>
    <text class="label" x="80" y="104" text-anchor="middle">p</text>
    <rect class="stack" x="120" y="86" width="18" height="28"/>
    <text class="label" x="129" y="105" text-anchor="middle">Z₀</text>
    <path class="arrow" d="M 138 100 L 200 100"/>
    <text class="label" x="150" y="90">pop</text>
    <rect class="stack" x="200" y="130" width="18" height="0"/>
    <text class="label" x="200" y="120">空</text>
  </g>
</svg>

