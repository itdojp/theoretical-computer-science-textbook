<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <title>有限オートマトンの例</title>
  <desc>2つの連続する0を検出する有限オートマトンの状態遷移図</desc>
  
  <defs>
    <style>
      .state-circle { 
        fill: #e3f2fd; 
        stroke: #1976d2; 
        stroke-width: 2px; 
      }
      
      .initial-state { 
        fill: #c8e6c9; 
        stroke: #388e3c; 
        stroke-width: 3px; 
      }
      
      .accept-state { 
        fill: #ffcdd2; 
        stroke: #d32f2f; 
        stroke-width: 3px; 
      }
      
      .state-label { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        dominant-baseline: central;
        fill: #1a1a1a;
      }
      
      .transition-arrow {
        stroke: #2c3e50;
        stroke-width: 2px;
        fill: none;
        marker-end: url(#arrowhead);
      }
      
      .transition-label { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 16px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #2c3e50;
      }
      
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .subtitle { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 14px; 
        font-weight: 400; 
        text-anchor: middle; 
        fill: #666;
      }
      
      .description { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        font-size: 12px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #333;
      }
      
      .start-indicator {
        stroke: #388e3c;
        stroke-width: 3px;
        fill: none;
        marker-end: url(#start-arrow);
      }
      
      .table-cell {
        stroke: #dee2e6;
        stroke-width: 1px;
      }
    </style>
    
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
    
    <marker id="start-arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#388e3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" class="title">有限オートマトンの例：2つの連続する0を検出</text>
  <text x="450" y="55" class="subtitle">DFA M = (Q, Σ, δ, q₀, F) where Q = {q₀, q₁, q₂}, Σ = {0, 1}</text>
  
  <!-- States with improved spacing -->
  
  <!-- Start indicator -->
  <path d="M 80 200 L 140 200" class="start-indicator" />
  <text x="70" y="180" class="description">開始</text>
  
  <!-- q₀ - Initial state -->
  <circle cx="180" cy="200" r="35" class="state-circle initial-state" />
  <text x="180" y="200" class="state-label">q₀</text>
  <text x="180" y="260" class="description" text-anchor="middle">初期状態</text>
  <text x="180" y="275" class="description" text-anchor="middle">0を待機中</text>
  
  <!-- q₁ - Intermediate state -->
  <circle cx="400" cy="200" r="35" class="state-circle" />
  <text x="400" y="200" class="state-label">q₁</text>
  <text x="400" y="260" class="description" text-anchor="middle">1つの0を読取り</text>
  <text x="400" y="275" class="description" text-anchor="middle">次の0を待機</text>
  
  <!-- q₂ - Accept state (double circle) -->
  <circle cx="680" cy="200" r="35" class="state-circle accept-state" />
  <circle cx="680" cy="200" r="28" class="state-circle accept-state" />
  <text x="680" y="200" class="state-label">q₂</text>
  <text x="680" y="260" class="description" text-anchor="middle">受理状態</text>
  <text x="680" y="275" class="description" text-anchor="middle">連続する00を検出</text>
  
  <!-- Transitions with clear paths -->
  
  <!-- q₀ to q₁ on 0 -->
  <path d="M 215 200 L 365 200" class="transition-arrow" />
  <rect x="275" y="185" width="30" height="25" fill="white" stroke="none" />
  <text x="290" y="200" class="transition-label">0</text>
  
  <!-- q₁ to q₂ on 0 -->
  <path d="M 435 200 L 645 200" class="transition-arrow" />
  <rect x="525" y="185" width="30" height="25" fill="white" stroke="none" />
  <text x="540" y="200" class="transition-label">0</text>
  
  <!-- q₀ to q₀ on 1 (self-loop) -->
  <path d="M 155 170 Q 180 130 205 170" class="transition-arrow" />
  <text x="180" y="115" class="transition-label">1</text>
  
  <!-- q₁ to q₀ on 1 -->
  <path d="M 375 175 Q 290 130 205 175" class="transition-arrow" />
  <text x="290" y="115" class="transition-label">1</text>
  
  <!-- q₂ to q₂ on 0,1 (self-loop) -->
  <path d="M 655 170 Q 680 130 705 170" class="transition-arrow" />
  <text x="680" y="115" class="transition-label">0, 1</text>

  <!-- Transition table with better layout -->
  <g transform="translate(100, 340)">
    <text x="350" y="20" class="title">遷移表 δ</text>
    
    <!-- Table header -->
    <rect x="0" y="40" width="120" height="40" fill="#f8f9fa" class="table-cell" />
    <rect x="120" y="40" width="120" height="40" fill="#f8f9fa" class="table-cell" />
    <rect x="240" y="40" width="120" height="40" fill="#f8f9fa" class="table-cell" />
    <rect x="360" y="40" width="180" height="40" fill="#f8f9fa" class="table-cell" />
    <rect x="540" y="40" width="120" height="40" fill="#f8f9fa" class="table-cell" />
    
    <text x="60" y="65" class="transition-label" text-anchor="middle">状態 \ 入力</text>
    <text x="180" y="65" class="transition-label" text-anchor="middle">0</text>
    <text x="300" y="65" class="transition-label" text-anchor="middle">1</text>
    <text x="450" y="65" class="transition-label" text-anchor="middle">説明</text>
    <text x="600" y="65" class="transition-label" text-anchor="middle">受理?</text>
    
    <!-- q₀ row -->
    <rect x="0" y="80" width="120" height="40" fill="white" class="table-cell" />
    <rect x="120" y="80" width="120" height="40" fill="white" class="table-cell" />
    <rect x="240" y="80" width="120" height="40" fill="white" class="table-cell" />
    <rect x="360" y="80" width="180" height="40" fill="white" class="table-cell" />
    <rect x="540" y="80" width="120" height="40" fill="white" class="table-cell" />
    
    <text x="60" y="105" class="transition-label" text-anchor="middle">q₀</text>
    <text x="180" y="105" class="transition-label" text-anchor="middle">q₁</text>
    <text x="300" y="105" class="transition-label" text-anchor="middle">q₀</text>
    <text x="450" y="105" class="description" text-anchor="middle">初期状態</text>
    <text x="600" y="105" class="description" text-anchor="middle">No</text>
    
    <!-- q₁ row -->
    <rect x="0" y="120" width="120" height="40" fill="white" class="table-cell" />
    <rect x="120" y="120" width="120" height="40" fill="white" class="table-cell" />
    <rect x="240" y="120" width="120" height="40" fill="white" class="table-cell" />
    <rect x="360" y="120" width="180" height="40" fill="white" class="table-cell" />
    <rect x="540" y="120" width="120" height="40" fill="white" class="table-cell" />
    
    <text x="60" y="145" class="transition-label" text-anchor="middle">q₁</text>
    <text x="180" y="145" class="transition-label" text-anchor="middle">q₂</text>
    <text x="300" y="145" class="transition-label" text-anchor="middle">q₀</text>
    <text x="450" y="145" class="description" text-anchor="middle">1つの0を記憶</text>
    <text x="600" y="145" class="description" text-anchor="middle">No</text>
    
    <!-- q₂ row -->
    <rect x="0" y="160" width="120" height="40" fill="#ffebee" class="table-cell" />
    <rect x="120" y="160" width="120" height="40" fill="#ffebee" class="table-cell" />
    <rect x="240" y="160" width="120" height="40" fill="#ffebee" class="table-cell" />
    <rect x="360" y="160" width="180" height="40" fill="#ffebee" class="table-cell" />
    <rect x="540" y="160" width="120" height="40" fill="#ffebee" class="table-cell" />
    
    <text x="60" y="185" class="transition-label" text-anchor="middle">q₂</text>
    <text x="180" y="185" class="transition-label" text-anchor="middle">q₂</text>
    <text x="300" y="185" class="transition-label" text-anchor="middle">q₂</text>
    <text x="450" y="185" class="description" text-anchor="middle">連続する00を検出</text>
    <text x="600" y="185" class="description" text-anchor="middle">Yes</text>
  </g>
  
  <!-- Example computation -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="740" height="130" style="fill: #f0f8ff; stroke: #4682b4; stroke-width: 1px; rx: 4px;" />
    <text x="370" y="25" class="subtitle">計算例</text>
    
    <text x="30" y="50" class="description">文字列 "1001" の処理:</text>
    <text x="30" y="70" class="description">q₀ --1--> q₀ --0--> q₁ --0--> q₂ --1--> q₂</text>
    <text x="30" y="90" class="description">結果: q₂ (受理状態) → 文字列は受理される</text>
    
    <text x="420" y="50" class="description">文字列 "1010" の処理:</text>
    <text x="420" y="70" class="description">q₀ --1--> q₀ --0--> q₁ --1--> q₀ --0--> q₁</text>
    <text x="420" y="90" class="description">結果: q₁ (非受理状態) → 文字列は拒否される</text>
    
    <text x="30" y="115" class="description">言語: L = {w ∈ {0,1}* | w中に部分文字列 "00" が含まれる}</text>
  </g>
</svg>