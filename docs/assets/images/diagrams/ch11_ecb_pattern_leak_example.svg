<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">ECB でパターンが露呈する例</title>
  <desc id="desc">同一平文ブロックが同一暗号文ブロックになるため、画像の模様がそのまま暗号文に残る様子の模式図。</desc>
  <defs>
    <style>
      .label { fill: #111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 12px; }
      .panel { fill: #f8f9fa; stroke: #dee2e6; }
      .grid { fill: none; stroke: #ced4da; stroke-width: 1; }
      .blk { fill: #adb5bd; }
      .blk2 { fill: #868e96; }
      .blk3 { fill: #495057; }
      .arrow { stroke: #212529; stroke-width: 1.6; marker-end: url(#m); fill: none; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#212529" />
    </marker>
  </defs>
  <g transform="translate(20,20)">
    <rect class="panel" x="0" y="0" width="300" height="200" rx="8"/>
    <text class="label" x="10" y="16">平文（繰り返し模様）</text>
    <!-- checker pattern blocks -->
    <g transform="translate(20,30)">
      <rect x="0" y="0" width="64" height="64" class="blk"/>
      <rect x="64" y="0" width="64" height="64" class="blk2"/>
      <rect x="128" y="0" width="64" height="64" class="blk"/>
      <rect x="192" y="0" width="64" height="64" class="blk2"/>

      <rect x="0" y="64" width="64" height="64" class="blk2"/>
      <rect x="64" y="64" width="64" height="64" class="blk3"/>
      <rect x="128" y="64" width="64" height="64" class="blk2"/>
      <rect x="192" y="64" width="64" height="64" class="blk3"/>

      <rect x="0" y="128" width="64" height="64" class="blk"/>
      <rect x="64" y="128" width="64" height="64" class="blk2"/>
      <rect x="128" y="128" width="64" height="64" class="blk"/>
      <rect x="192" y="128" width="64" height="64" class="blk2"/>
    </g>
  </g>
  <path class="arrow" d="M 340 120 L 400 120"/>
  <g transform="translate(420,20)">
    <rect class="panel" x="0" y="0" width="280" height="200" rx="8"/>
    <text class="label" x="10" y="16">ECB 暗号文（模様が残る）</text>
    <g transform="translate(20,30)">
      <rect x="0" y="0" width="64" height="64" class="blk"/>
      <rect x="64" y="0" width="64" height="64" class="blk2"/>
      <rect x="128" y="0" width="64" height="64" class="blk"/>
      <rect x="192" y="0" width="64" height="64" class="blk2"/>

      <rect x="0" y="64" width="64" height="64" class="blk2"/>
      <rect x="64" y="64" width="64" height="64" class="blk3"/>
      <rect x="128" y="64" width="64" height="64" class="blk2"/>
      <rect x="192" y="64" width="64" height="64" class="blk3"/>

      <rect x="0" y="128" width="64" height="64" class="blk"/>
      <rect x="64" y="128" width="64" height="64" class="blk2"/>
      <rect x="128" y="128" width="64" height="64" class="blk"/>
      <rect x="192" y="128" width="64" height="64" class="blk2"/>
    </g>
  </g>
</svg>

