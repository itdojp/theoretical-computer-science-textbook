<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" 
     role="img" aria-labelledby="title" aria-describedby="desc">
  <title id="title">停止問題の対角化論法</title>
  <desc id="desc">停止問題が決定不能であることを示す対角化論法の構造を可視化した図。仮想的な停止判定機械Hと対角化機械Dの矛盾を表現している。</desc>
  
  <defs>
    <style>
      .diagram-text { font-family: 'Inter', 'Helvetica', sans-serif; font-size: 14px; fill: #2c3e50; text-anchor: middle; }
      .small-text { font-size: 12px; }
      .large-text { font-size: 16px; font-weight: bold; }
      .input-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2; rx: 8; }
      .machine-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 8; }
      .diagonal-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; rx: 8; }
      .decision-diamond { fill: #f5f5f5; stroke: #666; stroke-width: 2; }
      .accept-box { fill: #e8f5e8; stroke: #4caf50; stroke-width: 2; rx: 6; }
      .reject-box { fill: #ffebee; stroke: #f44336; stroke-width: 2; rx: 6; }
      .loop-box { fill: #ffebee; stroke: #f44336; stroke-width: 3; rx: 6; stroke-dasharray: 5,5; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .contradiction-arrow { stroke: #d32f2f; stroke-width: 3; stroke-dasharray: 8,4; fill: none; marker-end: url(#contradiction-arrow); }
      .group-border { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 3,3; rx: 12; }
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    
    <marker id="contradiction-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" class="diagram-text large-text" style="fill: #1a237e;">停止問題の対角化論法</text>
  
  <!-- Group border for H machine section -->
  <rect x="50" y="60" width="320" height="200" class="group-border"/>
  <text x="210" y="80" class="diagram-text small-text" style="fill: #666;">仮想的な停止判定機械 H</text>
  
  <!-- Input -->
  <rect x="70" y="100" width="80" height="40" class="input-box"/>
  <text x="110" y="115" class="diagram-text small-text">入力:</text>
  <text x="110" y="130" class="diagram-text small-text">⟨M, w⟩</text>
  
  <!-- H machine -->
  <rect x="200" y="100" width="80" height="40" class="machine-box"/>
  <text x="240" y="115" class="diagram-text small-text">停止判定</text>
  <text x="240" y="130" class="diagram-text small-text">機械 H</text>
  
  <!-- Decision diamond -->
  <polygon points="310,120 350,95 390,120 350,145" class="decision-diamond"/>
  <text x="350" y="115" class="diagram-text small-text">M は w で</text>
  <text x="350" y="128" class="diagram-text small-text">停止？</text>
  
  <!-- Accept/Reject boxes for H -->
  <rect x="420" y="85" width="70" height="30" class="accept-box"/>
  <text x="455" y="103" class="diagram-text small-text">H: accept</text>
  
  <rect x="420" y="135" width="70" height="30" class="accept-box"/>
  <text x="455" y="153" class="diagram-text small-text">H: reject</text>
  
  <!-- Arrows for H section -->
  <line x1="150" y1="120" x2="190" y2="120" class="arrow"/>
  <line x1="280" y1="120" x2="305" y2="120" class="arrow"/>
  <line x1="390" y1="105" x2="415" y2="100" class="arrow"/>
  <line x1="390" y1="135" x2="415" y2="150" class="arrow"/>
  
  <!-- Labels for decision branches -->
  <text x="395" y="95" class="diagram-text small-text" style="fill: #4caf50;">停止する</text>
  <text x="395" y="170" class="diagram-text small-text" style="fill: #4caf50;">停止しない</text>
  
  <!-- Group border for D machine section -->
  <rect x="430" y="250" width="320" height="300" class="group-border"/>
  <text x="590" y="270" class="diagram-text small-text" style="fill: #666;">対角化機械 D</text>
  
  <!-- Input for D -->
  <rect x="450" y="290" width="80" height="40" class="input-box"/>
  <text x="490" y="305" class="diagram-text small-text">入力:</text>
  <text x="490" y="320" class="diagram-text small-text">⟨D⟩</text>
  
  <!-- D machine -->
  <rect x="580" y="290" width="80" height="40" class="diagonal-box"/>
  <text x="620" y="305" class="diagram-text small-text">対角化</text>
  <text x="620" y="320" class="diagram-text small-text">機械 D</text>
  
  <!-- Decision for D -->
  <polygon points="540,370 580,345 620,370 580,395" class="decision-diamond"/>
  <text x="580" y="365" class="diagram-text small-text">H(⟨D,⟨D⟩⟩)</text>
  <text x="580" y="378" class="diagram-text small-text">= ??</text>
  
  <!-- Loop box -->
  <rect x="470" y="420" width="80" height="40" class="loop-box"/>
  <text x="510" y="435" class="diagram-text small-text">無限</text>
  <text x="510" y="450" class="diagram-text small-text">ループ</text>
  
  <!-- Accept box for D -->
  <rect x="630" y="420" width="60" height="40" class="accept-box"/>
  <text x="660" y="443" class="diagram-text small-text">accept</text>
  
  <!-- Arrows for D section -->
  <line x1="530" y1="310" x2="570" y2="310" class="arrow"/>
  <line x1="620" y1="330" x2="580" y2="345" class="arrow"/>
  <line x1="550" y1="385" x2="520" y2="420" class="arrow"/>
  <line x1="610" y1="385" x2="650" y2="420" class="arrow"/>
  
  <!-- Labels for D decision branches -->
  <text x="480" y="400" class="diagram-text small-text" style="fill: #f44336;">accept（停止する）</text>
  <text x="650" y="400" class="diagram-text small-text" style="fill: #f44336;">reject（停止しない）</text>
  
  <!-- Contradiction arrows -->
  <path d="M 510 460 Q 530 430 560 395" class="contradiction-arrow"/>
  <path d="M 650 420 Q 630 405 610 390" class="contradiction-arrow"/>
  
  <!-- Contradiction labels -->
  <text x="480" y="500" class="diagram-text small-text" style="fill: #d32f2f; font-weight: bold;">矛盾！</text>
  <text x="670" y="500" class="diagram-text small-text" style="fill: #d32f2f; font-weight: bold;">矛盾！</text>
  
  <!-- Connection from H to D -->
  <path d="M 240 140 Q 240 180 240 220 Q 240 240 350 240 Q 450 240 490 270" 
        stroke="#666" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Explanation text -->
  <text x="50" y="580" class="diagram-text small-text" style="fill: #666;">
    対角化論法：仮想的な停止判定機械 H が存在すると仮定し、それを使って構成した機械 D が矛盾を生じることを示す
  </text>
</svg>