<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <title>偶数個の0を認識する有限オートマトン</title>
  <desc>0の個数が偶数かどうかを判定するDFAの状態遷移図</desc>
  
  <defs>
    <style>
      .state-circle { 
        fill: #e3f2fd; 
        stroke: #1976d2; 
        stroke-width: 2px; 
      }
      
      .initial-accept-state { 
        fill: #c8e6c9; 
        stroke: #388e3c; 
        stroke-width: 3px; 
      }
      
      .reject-state { 
        fill: #fce4ec; 
        stroke: #9c27b0; 
        stroke-width: 2px; 
      }
      
      .state-label { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        dominant-baseline: central;
        fill: #1a1a1a;
      }
      
      .transition-arrow {
        stroke: #2c3e50;
        stroke-width: 2px;
        fill: none;
        marker-end: url(#arrowhead);
      }
      
      .self-loop-arrow {
        stroke: #2c3e50;
        stroke-width: 2px;
        fill: none;
        marker-end: url(#arrowhead);
      }
      
      .transition-label { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
        font-size: 16px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #2c3e50;
      }
      
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .subtitle { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
        font-size: 14px; 
        font-weight: 400; 
        text-anchor: middle; 
        fill: #666;
      }
      
      .description { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
        font-size: 12px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #333;
      }
      
      .start-indicator {
        stroke: #388e3c;
        stroke-width: 3px;
        fill: none;
        marker-end: url(#start-arrow);
      }
      
      .note-box {
        fill: #fff9c4;
        stroke: #f57f17;
        stroke-width: 1px;
        rx: 4px;
        ry: 4px;
      }
      
      .table-cell {
        stroke: #dee2e6;
        stroke-width: 1px;
      }
    </style>
    
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
    
    <marker id="start-arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#388e3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" class="title">偶数個の0を認識するDFA</text>
  <text x="450" y="55" class="subtitle">M = ({q₀, q₁}, {0, 1}, δ, q₀, {q₀})</text>
  
  <!-- State diagram with improved spacing -->
  
  <!-- Start indicator -->
  <path d="M 120 180 L 180 180" class="start-indicator" />
  <text x="100" y="165" class="description">開始</text>
  
  <!-- q₀ - Initial and Accept state (double circle) -->
  <circle cx="220" cy="180" r="40" class="state-circle initial-accept-state" />
  <circle cx="220" cy="180" r="33" class="state-circle initial-accept-state" />
  <text x="220" y="180" class="state-label">q₀</text>
  <text x="220" y="250" class="description" text-anchor="middle">偶数個の0を読んだ状態</text>
  <text x="220" y="265" class="description" text-anchor="middle">（初期状態・受理状態）</text>
  
  <!-- q₁ - Odd state -->
  <circle cx="580" cy="180" r="35" class="state-circle reject-state" />
  <text x="580" y="180" class="state-label">q₁</text>
  <text x="580" y="250" class="description" text-anchor="middle">奇数個の0を読んだ状態</text>
  <text x="580" y="265" class="description" text-anchor="middle">（非受理状態）</text>
  
  <!-- Transitions with clear separation -->
  
  <!-- q₀ to q₁ on 0 (upper path) -->
  <path d="M 260 165 Q 400 120 545 165" class="transition-arrow" />
  <rect x="385" y="110" width="30" height="25" fill="white" stroke="none" />
  <text x="400" y="125" class="transition-label">0</text>
  
  <!-- q₁ to q₀ on 0 (lower path) -->
  <path d="M 545 195 Q 400 240 260 195" class="transition-arrow" />
  <rect x="385" y="235" width="30" height="25" fill="white" stroke="none" />
  <text x="400" y="250" class="transition-label">0</text>
  
  <!-- q₀ to q₀ on 1 (self-loop) -->
  <path d="M 195 150 Q 220 100 245 150" class="self-loop-arrow" />
  <text x="220" y="85" class="transition-label">1</text>
  
  <!-- q₁ to q₁ on 1 (self-loop) -->
  <path d="M 555 150 Q 580 100 605 150" class="self-loop-arrow" />
  <text x="580" y="85" class="transition-label">1</text>

  <!-- Explanation sections with better layout -->
  
  <!-- State meaning box -->
  <rect x="100" y="320" width="320" height="80" class="note-box" />
  <text x="260" y="340" class="subtitle">状態の意味</text>
  <text x="120" y="360" class="description">q₀: これまでに読んだ0の個数が偶数（受理状態）</text>
  <text x="120" y="380" class="description">q₁: これまでに読んだ0の個数が奇数（非受理状態）</text>

  <!-- Transition table -->
  <g transform="translate(480, 320)">
    <text x="120" y="20" class="subtitle">遷移表 δ</text>
    
    <!-- Table with improved spacing -->
    <rect x="0" y="40" width="80" height="35" fill="#f8f9fa" class="table-cell" />
    <rect x="80" y="40" width="60" height="35" fill="#f8f9fa" class="table-cell" />
    <rect x="140" y="40" width="60" height="35" fill="#f8f9fa" class="table-cell" />
    <rect x="200" y="40" width="80" height="35" fill="#f8f9fa" class="table-cell" />
    
    <text x="40" y="62" class="transition-label" text-anchor="middle">状態 \ 入力</text>
    <text x="110" y="62" class="transition-label" text-anchor="middle">0</text>
    <text x="170" y="62" class="transition-label" text-anchor="middle">1</text>
    <text x="240" y="62" class="transition-label" text-anchor="middle">受理?</text>
    
    <!-- q₀ row -->
    <rect x="0" y="75" width="80" height="35" fill="#e8f5e8" class="table-cell" />
    <rect x="80" y="75" width="60" height="35" fill="white" class="table-cell" />
    <rect x="140" y="75" width="60" height="35" fill="white" class="table-cell" />
    <rect x="200" y="75" width="80" height="35" fill="#e8f5e8" class="table-cell" />
    
    <text x="40" y="97" class="transition-label" text-anchor="middle">q₀</text>
    <text x="110" y="97" class="transition-label" text-anchor="middle">q₁</text>
    <text x="170" y="97" class="transition-label" text-anchor="middle">q₀</text>
    <text x="240" y="97" class="description" text-anchor="middle">Yes</text>
    
    <!-- q₁ row -->
    <rect x="0" y="110" width="80" height="35" fill="white" class="table-cell" />
    <rect x="80" y="110" width="60" height="35" fill="white" class="table-cell" />
    <rect x="140" y="110" width="60" height="35" fill="white" class="table-cell" />
    <rect x="200" y="110" width="80" height="35" fill="white" class="table-cell" />
    
    <text x="40" y="132" class="transition-label" text-anchor="middle">q₁</text>
    <text x="110" y="132" class="transition-label" text-anchor="middle">q₀</text>
    <text x="170" y="132" class="transition-label" text-anchor="middle">q₁</text>
    <text x="240" y="132" class="description" text-anchor="middle">No</text>
  </g>
  
  <!-- Example computation -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="740" height="140" style="fill: #f0f8ff; stroke: #4682b4; stroke-width: 1px; rx: 4px;" />
    <text x="370" y="25" class="subtitle">計算例</text>
    
    <text x="30" y="50" class="description">入力: 1001 → q₀ --1--> q₀ --0--> q₁ --0--> q₀ --1--> q₀ (受理)</text>
    <text x="30" y="70" class="description">入力: 101  → q₀ --1--> q₀ --0--> q₁ --1--> q₁ (拒否)</text>
    <text x="30" y="90" class="description">入力: 0011 → q₀ --0--> q₁ --0--> q₀ --1--> q₀ --1--> q₀ (受理)</text>
    
    <text x="420" y="50" class="description">言語: L = {w ∈ {0,1}* | w中の0の個数が偶数}</text>
    <text x="420" y="70" class="description">受理例: ε, 1, 11, 00, 101, 0110, ...</text>
    <text x="420" y="90" class="description">拒否例: 0, 10, 01, 000, 111, 001, ...</text>
    
    <text x="30" y="120" class="description">空文字列εは0の個数0（偶数）なので受理される</text>
  </g>
</svg>