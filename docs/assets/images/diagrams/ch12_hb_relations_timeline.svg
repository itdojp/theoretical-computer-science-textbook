<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">happens-before（HB）関係のタイムライン図</title>
  <desc id="desc">2スレッドの操作列と同期イベント（ロック/アンロック）による可視性の順序付け（HB）を示す図。</desc>
  <defs>
    <style>
      .label { fill: #111; font-family: Inter, Helvetica, Arial, sans-serif; font-size: 12px; }
      .thread { stroke: #868e96; stroke-width: 2; }
      .event { fill: #fff; stroke: #495057; stroke-width: 1.6; rx: 4px; }
      .sync { fill: #e7f5ff; stroke: #228be6; }
      .hb { stroke: #fa5252; stroke-width: 1.6; stroke-dasharray: 5,3; marker-end: url(#m); fill: none; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fa5252" />
    </marker>
  </defs>
  <g transform="translate(20,20)">
    <text class="label" x="0" y="0">T1</text>
    <line class="thread" x1="40" y1="0" x2="700" y2="0"/>
    <rect class="event" x="80" y="-14" width="60" height="28"/>
    <text class="label" x="110" y="5" text-anchor="middle">write x</text>
    <rect class="event sync" x="180" y="-14" width="60" height="28"/>
    <text class="label" x="210" y="5" text-anchor="middle">unlock m</text>

    <text class="label" x="0" y="60">T2</text>
    <line class="thread" x1="40" y1="60" x2="700" y2="60"/>
    <rect class="event sync" x="260" y="46" width="60" height="28"/>
    <text class="label" x="290" y="65" text-anchor="middle">lock m</text>
    <rect class="event" x="360" y="46" width="60" height="28"/>
    <text class="label" x="390" y="65" text-anchor="middle">read x</text>

    <path class="hb" d="M 210 10 C 230,20 260,40 290,60"/>
    <text class="label" x="250" y="38" fill="#fa5252">HB</text>
  </g>
</svg>

