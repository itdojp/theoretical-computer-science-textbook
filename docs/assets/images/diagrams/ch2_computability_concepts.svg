<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <title>計算可能性の概念と階層</title>
  <desc>計算可能関数、部分計算可能関数、Church-Turingの提唱</desc>
  
  <defs>
    <style>
      .computable-box { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2px; }
      .partial-computable-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 2px; }
      .thesis-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2px; }
      .evidence-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2px; }
      
      .concept-box { 
        rx: 4px; 
        ry: 4px; 
        font-family: Inter, Helvetica, sans-serif;
      }
      
      .title { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 18px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #1a1a1a;
      }
      
      .subtitle { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 14px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #2c3e50;
      }
      
      .concept-title { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 13px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #333;
      }
      
      .description { 
        font-family: Inter, Helvetica, sans-serif;
        font-size: 11px; 
        font-weight: 400; 
        text-anchor: start; 
        fill: #666;
      }
      
      .formula { 
        font-family: Courier, monospace;
        font-size: 12px; 
        font-weight: 600; 
        text-anchor: middle; 
        fill: #333;
      }
      
      .inclusion-arrow {
        stroke: #4caf50;
        stroke-width: 3px;
        fill: none;
        marker-end: url(#inclusion-arrowhead);
      }
      
      .equivalence-arrow {
        stroke: #1976d2;
        stroke-width: 2px;
        stroke-dasharray: 6,3;
        fill: none;
        marker-end: url(#equiv-arrowhead);
      }
    </style>
    
    <!-- Arrow markers -->
    <marker id="inclusion-arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#4caf50" />
    </marker>
    
    <marker id="equiv-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" class="title">計算可能性の概念と階層</text>
  
  <!-- Computable Functions -->
  <g id="computable-functions">
    <text x="200" y="70" class="subtitle">計算可能関数</text>
    
    <rect x="50" y="90" width="300" height="120" class="concept-box computable-box" />
    <text x="200" y="115" class="concept-title">チューリング計算可能関数</text>
    <text x="200" y="135" class="formula">f: Σ* → Σ*</text>
    
    <text x="70" y="160" class="description">• 全ての入力で停止</text>
    <text x="70" y="175" class="description">• 正しい出力を生成</text>
    <text x="70" y="190" class="description">• 決定性アルゴリズムが存在</text>
    
    <!-- Examples -->
    <rect x="50" y="230" width="300" height="80" class="concept-box computable-box" />
    <text x="200" y="255" class="concept-title">例</text>
    <text x="70" y="275" class="description">• 加算、乗算、階乗</text>
    <text x="70" y="290" class="description">• 文字列操作（連結、逆転）</text>
    <text x="70" y="305" class="description">• ソート、探索アルゴリズム</text>
  </g>
  
  <!-- Partial Computable Functions -->
  <g id="partial-computable">
    <text x="600" y="70" class="subtitle">部分計算可能関数</text>
    
    <rect x="450" y="90" width="300" height="120" class="concept-box partial-computable-box" />
    <text x="600" y="115" class="concept-title">部分計算可能関数</text>
    <text x="600" y="135" class="formula">f: Σ* ⇀ Σ*</text>
    
    <text x="470" y="160" class="description">• 定義域でのみ停止</text>
    <text x="470" y="175" class="description">• 定義域外では停止しない</text>
    <text x="470" y="190" class="description">• より一般的な概念</text>
    
    <!-- Examples -->
    <rect x="450" y="230" width="300" height="80" class="concept-box partial-computable-box" />
    <text x="600" y="255" class="concept-title">例</text>
    <text x="470" y="275" class="description">• 除算（0除算は未定義）</text>
    <text x="470" y="290" class="description">• 停止問題の解</text>
    <text x="470" y="305" class="description">• 逆関数（単射でない場合）</text>
  </g>
  
  <!-- Inclusion relationship -->
  <path d="M 350 150 L 450 150" class="inclusion-arrow" />
  <text x="400" y="140" class="description">⊆</text>
  
  <!-- Church-Turing Thesis -->
  <g id="church-turing-thesis">
    <text x="300" y="380" class="subtitle">Church-Turingの提唱</text>
    
    <rect x="50" y="400" width="500" height="100" class="concept-box thesis-box" />
    <text x="300" y="425" class="concept-title">直観的計算可能 ≡ チューリング計算可能</text>
    
    <text x="70" y="450" class="description">• 数学的定理ではなく、計算の本質に関する主張</text>
    <text x="70" y="465" class="description">• 「効果的に計算可能」な関数は全てチューリング機械で計算可能</text>
    <text x="70" y="480" class="description">• 現代計算理論の基礎的仮定</text>
    
    <!-- Supporting Evidence -->
    <rect x="50" y="520" width="500" height="120" class="concept-box evidence-box" />
    <text x="300" y="545" class="concept-title">支持する証拠</text>
    
    <text x="70" y="570" class="description">• 他の計算モデルとの等価性</text>
    <text x="80" y="585" class="description">- λ計算、再帰関数、Post機械、RAM</text>
    <text x="70" y="605" class="description">• 実用プログラムとの対応</text>
    <text x="80" y="620" class="description">- 現実の計算機で実行可能な全アルゴリズム</text>
    <text x="70" y="635" class="description">• 70年以上の検証と反例の不存在</text>
  </g>
  
  <!-- Equivalent Models -->
  <g id="equivalent-models">
    <text x="900" y="70" class="subtitle">等価な計算モデル</text>
    
    <!-- Turing Machine -->
    <rect x="800" y="100" width="200" height="60" class="concept-box thesis-box" />
    <text x="900" y="125" class="concept-title">チューリング機械</text>
    <text x="900" y="145" class="description">(Turing, 1936)</text>
    
    <!-- Lambda Calculus -->
    <rect x="800" y="180" width="200" height="60" class="concept-box thesis-box" />
    <text x="900" y="205" class="concept-title">λ計算</text>
    <text x="900" y="225" class="description">(Church, 1936)</text>
    
    <!-- Recursive Functions -->
    <rect x="800" y="260" width="200" height="60" class="concept-box thesis-box" />
    <text x="900" y="285" class="concept-title">再帰関数</text>
    <text x="900" y="305" class="description">(Kleene, 1936)</text>
    
    <!-- Post Machine -->
    <rect x="800" y="340" width="200" height="60" class="concept-box thesis-box" />
    <text x="900" y="365" class="concept-title">Post機械</text>
    <text x="900" y="385" class="description">(Post, 1936)</text>
    
    <!-- Equivalence arrows -->
    <path d="M 900 160 L 900 180" class="equivalence-arrow" />
    <path d="M 900 240 L 900 260" class="equivalence-arrow" />
    <path d="M 900 320 L 900 340" class="equivalence-arrow" />
    <path d="M 800 370 Q 750 420 800 130" class="equivalence-arrow" />
    
    <text x="1020" y="235" class="description">全て等価</text>
  </g>
  
  <!-- Modern Extensions -->
  <rect x="100" y="680" width="1000" height="100" style="fill: #f8f9fa; stroke: #6c757d; stroke-width: 2px; rx: 4px;" />
  <text x="600" y="710" class="subtitle">現代的拡張と意義</text>
  
  <text x="120" y="730" class="description">• 量子計算：量子チューリング機械による拡張（量子並列性）</text>
  <text x="120" y="745" class="description">• 相対化：オラクル付きチューリング機械による複雑性理論</text>
  <text x="120" y="760" class="description">• 実用的意義：プログラミング言語、コンパイラ、形式検証の理論的基盤</text>
  
  <text x="620" y="730" class="description">• 哲学的意義：心の計算理論、人工知能の可能性と限界</text>
  <text x="620" y="745" class="description">• 数学的意義：ヒルベルト第10問題の解決、ゲーデル不完全性定理</text>
  <text x="620" y="760" class="description">• 限界の理解：停止問題、決定不能問題の存在証明</text>
</svg>