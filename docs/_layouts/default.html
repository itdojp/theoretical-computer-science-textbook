<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  
  <!-- Mobile optimizations -->
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{ site.title | escape }}">
  
  <!-- GitHub Pages CSS reset and custom styles -->
  <style>
    /* Reset GitHub Pages default styles */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #24292e;
      background-color: #ffffff;
    }
    
    /* Container and layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    /* Header styles */
    .book-header {
      background: #f6f8fa;
      border-bottom: 1px solid #e1e4e8;
      padding: 0.5rem 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 50px;
    }
    
    .book-header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }
    
    .book-title {
      font-size: 1.125rem;
      font-weight: 600;
      text-decoration: none;
      color: #24292e;
    }
    
    /* Navigation */
    .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 1rem;
    }
    
    .nav-list a {
      text-decoration: none;
      color: #586069;
      padding: 0.5rem;
      border-radius: 4px;
    }
    
    .nav-list a:hover {
      background-color: #e1e4e8;
      color: #24292e;
    }
    
    /* Mobile menu */
    .mobile-menu-toggle {
      background: none;
      border: 1px solid #e1e4e8;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      color: #586069;
    }
    
    .mobile-menu-toggle:hover {
      background-color: #e1e4e8;
      color: #24292e;
    }
    
    .header-spacer {
      width: 40px;
    }
    
    /* Sidebar */
    .book-sidebar {
      position: fixed;
      left: -280px;
      top: 50px;
      width: 280px;
      height: calc(100vh - 50px);
      background: #f6f8fa;
      border-right: 1px solid #e1e4e8;
      padding: 1rem;
      overflow-y: auto;
      transition: left 0.3s ease;
      z-index: 1000;
    }
    
    .book-sidebar.open {
      left: 0;
    }
    
    .book-sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 999;
    }
    
    .book-sidebar-overlay.active {
      display: block;
    }
    
    /* Main content */
    .book-main {
      margin-left: 0;
      padding: 2rem 0;
      min-height: calc(100vh - 200px);
    }
    
    /* Sidebar navigation */
    .sidebar-title {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #24292e;
    }
    
    .nav-section {
      margin-bottom: 1.5rem;
    }
    
    .nav-section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #586069;
    }
    
    .nav-section .nav-list {
      flex-direction: column;
      gap: 0.25rem;
    }
    
    .nav-section .nav-list a {
      display: block;
      padding: 0.5rem 0.75rem;
      margin: 0;
    }
    
    /* Page navigation */
    .page-navigation {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #e1e4e8;
    }
    
    .nav-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    
    .nav-link {
      padding: 0.75rem 1rem;
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      text-decoration: none;
      color: #586069;
      display: inline-block;
      min-width: 120px;
      text-align: center;
    }
    
    .nav-link:hover {
      background: #e1e4e8;
      color: #24292e;
    }
    
    .nav-spacer {
      min-width: 120px;
      height: 1px;
    }
    
    /* Footer */
    .book-footer {
      background: #f6f8fa;
      border-top: 1px solid #e1e4e8;
      padding: 2rem 0;
      margin-top: 3rem;
      text-align: center;
      color: #586069;
    }
    
    /* Responsive design */
    @media (max-width: 768px) {
      .book-nav.tablet-up {
        display: none;
      }
      
      .mobile-menu-toggle {
        display: block;
      }
      
      .mobile-only {
        display: block;
      }
      
      .tablet-up {
        display: none;
      }
    }
    
    /* Content wrapper for desktop layout */
    .book-content-wrapper {
      display: block;
      margin-top: 50px; /* Header height */
    }
    
    @media (min-width: 769px) {
      .mobile-only {
        display: none;
      }
      
      .mobile-menu-toggle {
        display: none;
      }
      
      .book-content-wrapper {
        display: flex;
        min-height: calc(100vh - 50px);
      }
      
      .book-sidebar {
        position: fixed;
        left: 0;
        top: 50px;
        width: 280px;
        height: calc(100vh - 50px);
        padding: 1rem;
        border-right: 1px solid #e1e4e8;
        background: #f6f8fa;
        overflow-y: auto;
        flex-shrink: 0;
      }
      
      .book-main {
        margin-left: 280px;
        flex-grow: 1;
        padding: 2rem;
        width: calc(100% - 280px);
      }
      
      .book-sidebar-overlay {
        display: none !important;
      }
    }
    
    /* Typography improvements */
    h1, h2, h3, h4, h5, h6 {
      margin-top: 2rem;
      margin-bottom: 1rem;
      line-height: 1.25;
    }
    
    h1 { font-size: 2rem; }
    h2 { font-size: 1.5rem; }
    h3 { font-size: 1.25rem; }
    
    p {
      margin-bottom: 1rem;
    }
    
    ul, ol {
      margin-bottom: 1rem;
      padding-left: 2rem;
    }
    
    code {
      background: #f6f8fa;
      padding: 0.125rem 0.25rem;
      border-radius: 3px;
      font-size: 0.875rem;
    }
    
    pre {
      background: #f6f8fa;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    
    blockquote {
      border-left: 4px solid #e1e4e8;
      padding-left: 1rem;
      margin-left: 0;
      color: #586069;
    }
  </style>
  
  <!-- Custom CSS if available -->
  {% if site.custom_css %}
    <link rel="stylesheet" href="{{ site.custom_css | relative_url }}">
  {% endif %}
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  
  <!-- RSS feed -->
  {% feed_meta %}
  
  <!-- SEO tags -->
  {% seo %}
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  
  <!-- Mermaid Support -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'default',
      securityLevel: 'loose'
    });
  </script>
</head>
<body class="book-layout">
  <header class="book-header">
    <div class="container">
      <div class="book-header-content">
        <button class="mobile-menu-toggle" aria-label="メニューを開く">
          ☰
        </button>
        
        <a href="{{ '/' | relative_url }}" class="book-title">{{ site.title | escape }}</a>
        
        <div class="header-spacer"></div>
      </div>
    </div>
  </header>

  <div class="book-content-wrapper">
    <div class="book-sidebar-overlay"></div>
    
    <aside class="book-sidebar" aria-label="サイドナビゲーション">
      {% include sidebar.html %}
    </aside>

    <main class="book-main">
      <div class="container">
        <div class="book-content">
          {{ content }}
          
          {% include page-navigation.html %}
        </div>
      </div>
    </main>
  </div>

  <footer class="book-footer">
    <div class="container">
      <div class="book-footer-content">
        <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author | escape }}. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Mobile Navigation Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const mobileToggle = document.querySelector('.mobile-menu-toggle');
      const sidebar = document.querySelector('.book-sidebar');
      const overlay = document.querySelector('.book-sidebar-overlay');
      
      if (mobileToggle && sidebar && overlay) {
        mobileToggle.addEventListener('click', function() {
          sidebar.classList.toggle('open');
          overlay.classList.toggle('active');
        });
        
        overlay.addEventListener('click', function() {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        });
        
        // Close sidebar on ESC key
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
          }
        });
      }
    });
  </script>
  
  {% if site.custom_js %}
    <script src="{{ site.custom_js | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
