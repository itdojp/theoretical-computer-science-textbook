title: "理論計算機科学教科書"
description: "数学的基礎から始まり、計算理論、アルゴリズム、複雑性理論、そして最新の研究トピックまでを包括的にカバーする理論計算機科学の教科書。大学生、大学院生、研究者向けの体系的学習リソース。"
author: "株式会社アイティードゥ"
version: "1.0.0"
lang: "ja"

# GitHub Pages設定
url: "https://itdojp.github.io"
baseurl: "/theoretical-computer-science-textbook"

# Jekyll設定
markdown: kramdown
highlighter: rouge
permalink: pretty

# GitHub Pages対応プラグイン
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter

# 除外ファイル
exclude:
  - node_modules/
  - package.json
  - package-lock.json
  - scripts/
  - tests/
  - templates/
  - book-config.json
  - mobile-config.json

# 日本語対応
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    line_numbers: false

# リポジトリ情報
repository: "https://github.com/itdojp/theoretical-computer-science-textbook"

